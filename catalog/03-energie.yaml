id: "03-energie"
title: "Power: no standby, display stays on"
scope: global
target: computer
description: >
  No hibernation/standby (AC+DC=Never), no hybrid standby, and by default the display
  never switches off either (display_off_seconds: 0) — so a machine driving a beamer or
  an interactive panel does not go dark mid-lesson. Set display_off_seconds in site.yaml
  to a number of seconds to re-enable the timeout. This keeps the machines reachable over
  the network. Teacher notebooks (@teachernb) are excluded via Deny-Apply (Windows default
  power plan).
  NOTE: the screen still LOCKS after 30 min (pack 04-sperren, InactivityTimeoutSecs) — the
  display then shows the lock screen instead of going dark. Those are two separate things.
filter_deny: ['@teachernb']
registry:
  # Standby timeout = Never (SUB_SLEEP STANDBYIDLE 29f6c1db...)
  - { key: 'Software\Policies\Microsoft\Power\PowerSettings\29f6c1db-86da-48c5-9fdb-f2b67b1f44da', name: ACSettingIndex, class: machine, type: dword, data: 0 }
  - { key: 'Software\Policies\Microsoft\Power\PowerSettings\29f6c1db-86da-48c5-9fdb-f2b67b1f44da', name: DCSettingIndex, class: machine, type: dword, data: 0 }
  # Hibernate timeout = Never (9d7815a6...)
  - { key: 'Software\Policies\Microsoft\Power\PowerSettings\9d7815a6-7ee4-497e-8888-515a05f02364', name: ACSettingIndex, class: machine, type: dword, data: 0 }
  - { key: 'Software\Policies\Microsoft\Power\PowerSettings\9d7815a6-7ee4-497e-8888-515a05f02364', name: DCSettingIndex, class: machine, type: dword, data: 0 }
  # Forbid standby states (S1-S3) (abfc2519...)
  - { key: 'Software\Policies\Microsoft\Power\PowerSettings\abfc2519-3608-4c2a-94ea-171b0ed546ab', name: ACSettingIndex, class: machine, type: dword, data: 0 }
  - { key: 'Software\Policies\Microsoft\Power\PowerSettings\abfc2519-3608-4c2a-94ea-171b0ed546ab', name: DCSettingIndex, class: machine, type: dword, data: 0 }
  # Hybrid standby off (94ac6d29...)
  - { key: 'Software\Policies\Microsoft\Power\PowerSettings\94ac6d29-73ce-41a6-809f-6363ba21b47e', name: ACSettingIndex, class: machine, type: dword, data: 0 }
  - { key: 'Software\Policies\Microsoft\Power\PowerSettings\94ac6d29-73ce-41a6-809f-6363ba21b47e', name: DCSettingIndex, class: machine, type: dword, data: 0 }
  # Display off timeout (SUB_VIDEO VIDEOIDLE 3c0bc021...); 0 = never, default
  - { key: 'Software\Policies\Microsoft\Power\PowerSettings\3c0bc021-c8a8-4e07-a973-6b14cbcb2b7e', name: ACSettingIndex, class: machine, type: dword, data: '@display-off' }
  - { key: 'Software\Policies\Microsoft\Power\PowerSettings\3c0bc021-c8a8-4e07-a973-6b14cbcb2b7e', name: DCSettingIndex, class: machine, type: dword, data: '@display-off' }
