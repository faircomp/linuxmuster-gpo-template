# From linuxmusterDEV/templates/ci.yml. Three jobs on every push/PR: the fast tier (the
# sanity checks that used to run only at release time in release.yml), the package build
# in the same container upstream CI uses, and an install smoke on ubuntu-24.04. The real
# end-to-end check, `lmn-gpo selftest`, needs a Samba AD DC and runs in the lab, not here.
name: ci

on:
  push:
    branches: ['**']
    tags: ['v[0-9]*']       # the sanity checks run for releases too (release.yml only gates/builds)
  pull_request:
  workflow_dispatch:
    inputs:
      prev_tag:
        description: 'upgrade smoke: tag to upgrade from (empty = newest published release)'
        required: false
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    runs-on: ubuntu-latest        # GitHub-hosted: ships python3 with PyYAML and pwsh
    steps:
      - uses: actions/checkout@v4

      - name: Sanity check (Python compiles, catalog parses, PowerShell is ASCII)
        run: |
          python3 -m py_compile lmn_gpo/*.py
          python3 -c "import yaml, glob; [yaml.safe_load(open(f)) for f in sorted(glob.glob('catalog/*.yaml'))]"
          # Windows PowerShell 5.1 reads a .ps1 without BOM in the system codepage. A UTF-8
          # em-dash then decodes to a curly quote, which ENDS the string early and breaks the
          # whole script on the client. Keep every shipped .ps1 pure ASCII.
          python3 - <<'PY'
          import glob, re, sys
          bad = {}
          for f in sorted(glob.glob('scripts/*.ps1')):
              s = open(f, encoding='utf-8').read()
              chars = sorted({c for c in s if ord(c) > 127})
              if chars:
                  bad[f] = chars
          if bad:
              for f, chars in bad.items():
                  print(f"::error file={f}::non-ASCII in a shipped PowerShell script: "
                        + ", ".join(f"{c!r} U+{ord(c):04X}" for c in chars))
              sys.exit(1)
          print("powershell: pure ASCII ok")
          PY
          echo "sanity ok"

      - name: Version (lmn-gpo --version must equal debian/changelog, the single source)
        run: |
          WANT=$(dpkg-parsechangelog -S Version)
          GOT=$(./lmn-gpo-cli --version)
          echo "changelog=$WANT  cli=$GOT"
          test "$GOT" = "lmn-gpo $WANT" || { echo "::error::lmn-gpo --version says '$GOT', debian/changelog says $WANT"; exit 1; }

      - name: Generate the dynamic PowerShell (Wi-Fi) for syntax checking
        run: |
          # lmn_gpo/wlan.py BUILDS a .ps1 at apply time; it never exists in scripts/, so the
          # parser check below would not see it -- yet it runs unattended on every client.
          mkdir -p /tmp/gen-ps
          python3 - <<'PY'
          import sys, re; sys.path.insert(0, '.')
          from lmn_gpo import wlan
          # ONE network is its own fixture on purpose: 1.9.0 shipped a generator that only
          # worked with two or more, and a two-network fixture kept CI green while every
          # single-network site got no Wi-Fi at all.
          cases = {
              'wlan-psk-one': wlan.build_psk_script([{'ssid': 'Einziges Netz', 'psk': 'passphrase123'}]),
              'wlan-psk-two': wlan.build_psk_script([{'ssid': "A's Netz", 'psk': 'passphrase123'},
                                                     {'ssid': 'Zweites Netz', 'psk': 'passphrase456'}]),
              # umlaut SSID: must not put a non-ASCII byte into the .ps1
              'wlan-psk-uml': wlan.build_psk_script([{'ssid': 'Schueler-Netz-äöü', 'psk': 'passphrase789'}]),
              # a meaningless DER blob is enough for a parse check - only its base64 and
              # SHA-1 end up in the script. One and several networks are both covered,
              # because a single entry is where the array shape used to collapse.
              'wlan-ent-one': wlan.build_enterprise_script(
                  [{'ssid': 'Lehrer', 'servernames': 'radius.example.org',
                    'ca_der': b'\x30\x03\x02\x01\x00'}]),
              'wlan-ent-two': wlan.build_enterprise_script(
                  [{'ssid': 'Lehrer A', 'servernames': 'radius-a.example.org',
                    'ca_der': b'\x30\x03\x02\x01\x00'},
                   {'ssid': "Lehrer B's Netz", 'servernames': 'radius-b.example.org',
                    'ca_der': b'\x30\x03\x02\x01\x01'}]),
          }
          bad = False
          for name, text in cases.items():
              nonascii = sorted({c for c in text if ord(c) > 127})
              if nonascii:
                  print(f"::error::{name}: non-ASCII in generated PowerShell: {nonascii}")
                  bad = True
              # the 1.9.0 bug in one assertion: a bare @( @(..) ) collapses for a single row
              if re.search(r'\$PROFILES\s*=\s*@\(', text):
                  print(f"::error::{name}: $PROFILES built with @( ... ) - collapses when there "
                        f"is exactly one profile; use a typed List")
                  bad = True
              open(f'/tmp/gen-ps/{name}.ps1', 'w').write(text)
          if bad:
              sys.exit(1)
          print(f'generated {len(cases)} scripts')
          PY

      - name: Drive maps XML check
        run: |
          python3 - <<'PY'
          import sys, xml.dom.minidom as md; sys.path.insert(0, '.')
          from lmn_gpo import drives, catalog
          p = {x.id: x for x in catalog.load_packs()}["19-home-h"]
          # Drive Maps is USER policy and carries no registry entries - if has_user ever
          # went false the GPO would be created as a machine GPO and silently do nothing.
          assert p.has_user and not p.has_machine and p.type_letter == "U", \
              f"19-home-h has the wrong GPO type: {p.type_letter}"
          xml = drives.render([dict(i) for i in p.drives], "{00000000-0000-0000-0000-000000000000}")
          xml.encode("ascii")                    # non-ASCII in sysvol XML breaks clients
          flat = xml.replace("\r\n", "\n")
          md.parseString(flat)                   # must be well-formed
          # Exactly the shape proven on a real Windows 11 client. Any drift here means the
          # H: mapping silently stops working, which no other test would catch.
          for must in ['attribute="homeDirectory"', 'variableName="lmnHomeDirectory"',
                       'path="%lmnHomeDirectory%"', 'binding="LDAP:"',
                       'searchFilter="(&amp;(objectClass=user)(sAMAccountName=%LogonUser%))"',
                       'action="U"', 'useLetter="1"', 'persistent="0"', 'bypassErrors="1"']:
              assert must in flat, f"missing from Drives.xml: {must}"
          # KB3091116: useLetter="0" is "delete all, starting at" and wipes every mapping
          # from that letter through Z:. It must never appear.
          assert 'useLetter="0"' not in flat, 'useLetter="0" would wipe drive letters'
          print("drive maps: ok")
          PY

      - name: Engine logic (GPO name parser, remove selection, skip reasons, exclusions — no DC needed)
        run: |
          # Applier and GpoEngine construct without touching AD, so the decisions apply
          # makes BEFORE it writes anything are checked here against a fake two-school
          # domain (default-school with d_nopxe, school 'one' without — the lab layout).
          python3 - <<'PY'
          import io, sys, contextlib; sys.path.insert(0, '.')
          from lmn_gpo import apply, catalog
          from lmn_gpo.env import Env, School, Group

          # A two-school domain like the lab: default-school has d_nopxe, school 'one' has none.
          BASE = "DC=dev,DC=lmschule,DC=de"
          def school(name, nopxe):
              dn = f"OU={name},OU=SCHOOLS,{BASE}"
              return School(name=name, dn=dn, prefix="" if name == "default-school" else f"{name}-",
                            is_default=(name == "default-school"), devices_ou=f"OU=Devices,{dn}",
                            management_ou=f"OU=Management,{dn}",
                            admins=Group(cn="admins", dn=f"CN=admins,OU=Management,{dn}", sid="S-1-5-21-1-2-3-1105"),
                            nopxe=Group(cn="d_nopxe", dn=f"CN=d_nopxe,OU=Devices,{dn}", sid="S-1-5-21-1-2-3-1145") if nopxe else None)
          env = Env(realm="DEV.LMSCHULE.DE", dnsdomain="dev.lmschule.de", basedn=BASE, netbios="DEV",
                    serverip="10.250.0.10", subnet="10.250.0.0/24", sysvol_policies="/nonexistent",
                    schools_ou=f"OU=SCHOOLS,{BASE}", global_ou=f"OU=GLOBAL,{BASE}",
                    schools=[school("default-school", True), school("one", False)])
          default, one = env.schools
          packs = {p.id: p for p in catalog.load_packs()}
          # No sam.ldb here: the global role groups (@role-student ...) resolve through a stub, the
          # device groups (@nopxe/@teachernb) through the School objects above.
          apply.ad.find_one = lambda expr, base=None, scope="sub", attrs=None: {"role": expr} if "role-" in expr else None
          apply.ad.sid_of = lambda msg: "S-1-5-21-1-2-3-1119"

          # --- remove: the GPO name parser and the --school/--pack selection --------------------
          scopes = ["default-school", "one", "GLOBAL"]
          ids = set(packs)
          parse = lambda name, sc=scopes: apply.parse_gpo_name(name, sc, ids)
          assert parse("LMN-C-default-school-07-admins-schule") == ("C", "default-school", "07-admins-schule")
          assert parse("LMN-U-one-12-proxy-student-schule") == ("U", "one", "12-proxy-student-schule")
          assert parse("LMN-CU-GLOBAL-15-lockdown-base") == ("CU", "GLOBAL", "15-lockdown-base")
          assert parse("LMN-C-one-x-07-admins-schule", ["one", "one-x"]) == ("C", "one-x", "07-admins-schule")
          # prefix collision: school 'one-07' must not claim school one's 07-admins-schule GPO
          assert parse("LMN-C-one-07-admins-schule", ["one", "one-07"]) == ("C", "one", "07-admins-schule")
          assert parse("LMN-C-one-07-07-admins-schule", ["one", "one-07"]) == ("C", "one-07", "07-admins-schule")
          assert parse("LMN-C-one-no-such-pack") is None                       # unknown pack id: not attributed
          assert parse("LMN-SELFTEST-DELETEME") is None
          assert parse("sophomorix:school:one") is None
          sel = lambda name, sc=scopes, **kw: apply.selected_for_removal(name, sc, ids, **kw)
          assert sel("LMN-C-one-07-admins-schule", schools=["one"])
          assert not sel("LMN-C-one-07-admins-schule", ["one", "one-07"], schools=["one-07"]), "remove --school one-07 must not touch school one"
          assert sel("LMN-C-one-07-admins-schule", ["one", "one-07"], schools=["one"])
          assert not sel("LMN-C-default-school-07-admins-schule", schools=["one"])
          assert not sel("LMN-C-GLOBAL-02-updates", schools=["one"]), "a school selection must never remove a global GPO"
          assert sel("LMN-C-GLOBAL-02-updates")                                 # no filter = everything
          assert sel("LMN-C-GLOBAL-02-updates", only_ids=["02-updates"])
          assert not sel("LMN-C-one-07-admins-schule", only_ids=["02-updates"])
          assert sel("LMN-C-one-07-admins-schule", only_ids=["07-admins-schule"], schools=["one"])
          assert not sel("LMN-C-one-07-admins-schule", only_ids=["07-admins-schule"], schools=["default-school"])
          assert not sel("sophomorix:school:one")
          assert sel("LMN-SELFTEST-DELETEME") and not sel("LMN-SELFTEST-DELETEME", schools=["one"])
          assert not sel("LMN-C-one-no-such-pack", schools=["one"])            # unattributable: never by --school
          print("remove selection: ok")

          # --- optional packs say why they are skipped ------------------------------------------
          ap = apply.Applier(env, {"firefox_homepage_by_school": {"one": "https://start.one"}}, dry_run=True)
          r = ap._skip_reason(packs["11-firefox-homepage-schule"], one)
          assert "firefox_enabled" in r and "https://start.one" in r and "ignored" in r, r
          ap = apply.Applier(env, {"firefox_enabled": True}, dry_run=True)
          assert "firefox_homepage" in ap._skip_reason(packs["11-firefox-homepage-schule"], one)
          ap = apply.Applier(env, {"firefox_enabled": True, "firefox_homepage": "https://x"}, dry_run=True)
          assert ap._skip_reason(packs["11-firefox-homepage-schule"], one) == ""
          ap = apply.Applier(env, {"proxy_host_by_school": {"one": "proxy.one"}}, dry_run=True)
          assert "proxy_enabled" in ap._skip_reason(packs["12-proxy-student-schule"], one)
          assert ap._skip_reason(packs["09-kms"], None) == "kmshost is empty"
          assert ap._skip_reason(packs["00-datenschutz"], None) == "", "always-on packs have no skip reason"
          print("skip reasons: ok")

          # --- @teachernb / @nopxe: one rule, no 'warn + exit 1 but created anyway' -------------
          proxy = {"proxy_enabled": True, "proxy_host": "proxy.example"}
          ap = apply.Applier(env, proxy, dry_run=True)                       # teachernb: nopxe (default)
          assert ap._exclusion("@teachernb", one, [one])[1] == "missing"      # school pack, no d_nopxe here
          sids, status, note = ap._exclusion("@teachernb", None, env.schools)  # global pack: resolves via default-school
          assert status == "ok" and sids == ["S-1-5-21-1-2-3-1145"] and "one" in note, (status, note)
          assert ap._exclusion("@teachernb", default, [default])[1] == "ok"
          assert ap._exclusion("@nopxe", one, [one])[1] == "missing"
          ap = apply.Applier(env, {**proxy, "teachernb": "skip"}, dry_run=True)
          assert ap._exclusion("@teachernb", one, [one])[1] == "disabled"
          assert ap._exclusion("@nopxe", one, [one])[1] == "missing", "teachernb: skip must not touch @nopxe"
          # only the literal 'skip' disables: a bare 'teachernb:' (None) or '' is the default nopxe, ' skip ' is skip
          for raw, want in ((None, "nopxe"), ("", "nopxe"), ("  ", "nopxe"), (" skip ", "skip"), ("Skip", "Skip")):
              assert apply.Applier(env, {"teachernb": raw}, dry_run=True)._teachernb() == want, raw
          assert apply.Applier(env, {**proxy, "teachernb": None}, dry_run=True)._exclusion("@teachernb", one, [one])[1] == "missing"
          assert apply.Applier(env, {**proxy, "teachernb": None}, dry_run=True)._exclusion("@teachernb", default, [default])[1] == "ok"
          ap = apply.Applier(env, {**proxy, "teachernb": "d_typo"}, dry_run=True)   # a CN that exists nowhere
          ap._find_group_sid = lambda cn, base: None
          assert ap._exclusion("@teachernb", None, env.schools)[1] == "missing"
          # preflight rows carry the status apply acts on (the CA path only has to exist here;
          # this script arrives via stdin, so __file__ would not do)
          ap = apply.Applier(env, {**proxy, "schools": ["one"], "packs": ["12-proxy-student-schule", "12-proxy-base"]}, dry_run=True)
          rows = ap.preflight(list(packs.values()))
          by = {(r[0], r[4]) for r in rows}
          assert ("12-proxy-student-schule", "missing") in by, rows
          assert ("12-proxy-base", "partial") in by, rows
          ap = apply.Applier(env, {**proxy, "teachernb": "skip", "schools": ["one"], "packs": ["12-proxy-student-schule", "13-wlan-enterprise"],
                                   "wlan_enterprise_networks": [{"ssid": "x", "ca_cert": "lib/veyon-default-pub.pem"}]}, dry_run=True)
          rows = ap.preflight(list(packs.values()))
          by = {(r[0], r[2], r[4]) for r in rows}
          assert ("12-proxy-student-schule", "exclude-read", "disabled") in by, rows
          assert ("13-wlan-enterprise", "only", "disabled") in by, rows
          # apply_pack on the fake env: the held-back pack never reaches the engine (no samba-tool call)
          class Boom(Exception): pass
          def boom(*a, **k): raise Boom("engine touched")
          ap = apply.Applier(env, {**proxy, "schools": ["one"]}, dry_run=True)
          ap.eng.find_by_name = lambda name: None
          ap.eng.ensure = boom
          out = io.StringIO()
          with contextlib.redirect_stdout(out):
              ap.apply_pack(packs["12-proxy-student-schule"], one, [one])
          assert "held back" in out.getvalue() and ap.held_back == ["LMN-U-one-12-proxy-student-schule"], out.getvalue()
          # an exclusive filter that resolves to nothing is held back too, before the engine is touched
          ap = apply.Applier(env, {"teachernb": "skip", "wlan_enterprise_networks": [{"ssid": "x", "ca_cert": "lib/veyon-default-pub.pem"}]}, dry_run=True)
          ap.eng.find_by_name = lambda name: None
          ap.eng.ensure = boom
          out = io.StringIO()
          with contextlib.redirect_stdout(out):
              ap.apply_pack(packs["13-wlan-enterprise"], None, env.schools)
          assert "held back: teachernb: skip" in out.getvalue() and ap.held_back == ["LMN-C-GLOBAL-13-wlan-enterprise"] and not ap.skipped, out.getvalue()
          ap = apply.Applier(env, {"firefox_homepage_by_school": {"one": "https://start.one"}, "schools": ["one"]}, dry_run=True)
          ap.eng.find_by_name = lambda name: None
          ap.eng.ensure = boom
          out = io.StringIO()
          with contextlib.redirect_stdout(out):
              ap.apply_pack(packs["11-firefox-homepage-schule"], one, [one])
          assert "skipped: firefox_enabled is not true" in out.getvalue() and ap.skipped, out.getvalue()
          print("exclusions: ok")

          # --- loopback: Microsoft's values, pinned -------------------------------------------
          # GroupPolicy.admx (CSE_LoopbackMode) and the client's event 5311 both say:
          # 1 = Merge, 2 = Replace. 7.3.1 had the mapping inverted, so `loopback: merge` put
          # every managed client into REPLACE and silently dropped every user GPO linked in
          # the user's own OU path. Proven on a Windows 11 client, so this is pinned here.
          assert apply.LOOPBACK_MODE == {"merge": 1, "replace": 2}, apply.LOOPBACK_MODE
          ap = apply.Applier(env, {}, dry_run=True)
          ent = {(e["valuename"], e["class"]): e
                 for e in ap._registry_entries(packs["15-lockdown-base"], None, {})}
          upm = ent[("UserPolicyMode", "MACHINE")]
          assert upm["keyname"] == r"Software\Policies\Microsoft\Windows\System", upm
          assert upm["type"] == "REG_DWORD" and upm["data"] == 1, \
              f"15-lockdown-base declares 'loopback: merge' -> UserPolicyMode must be 1 (Merge), got {upm}"
          # every catalog value must be one this engine knows, and no pack may ship 'replace'
          # unintentionally (nothing in the catalog needs it)
          for p in packs.values():
              assert p.loopback in ("none",) or p.loopback in apply.LOOPBACK_MODE, (p.id, p.loopback)
              assert p.loopback != "replace", f"{p.id}: loopback replace drops the user's own GPOs"
          # a pack WITHOUT loopback must not write UserPolicyMode at all
          assert not [e for e in ap._registry_entries(packs["02-updates"], None, {})
                      if e["valuename"] == "UserPolicyMode"]
          print("loopback mapping: ok")

          # --- the loopback prerequisite of the per-school user packs -------------------------
          # scope: school + USER settings -> linked to OU=Devices, a SIBLING of the user OUs:
          # without a pack that sets UserPolicyMode these GPOs reach nobody, and until 7.3.2
          # apply just reported "Done: N GPO(s) applied."
          assert {p.id for p in packs.values() if apply.Applier.needs_loopback(p)} == \
              {"12-proxy-student-schule", "12-proxy-teacher-schule", "12-proxy-staff-schule"}, \
              sorted(p.id for p in packs.values() if apply.Applier.needs_loopback(p))
          allp = list(packs.values())
          # only the role proxy selected -> gap, and the warning names pack, school and the fix
          ap = apply.Applier(env, {**proxy, "schools": ["default-school"],
                                   "packs": ["12-proxy-student-schule"]}, dry_run=True)
          ap.eng.find_by_name = lambda name: None          # nothing applied on this DC yet
          rows = ap.loopback_gap(allp)
          assert [(r[0], r[1]) for r in rows] == [("12-proxy-student-schule", "default-school")], rows
          assert rows[0][2][:2] == ["12-proxy-base", "15-lockdown-base"], rows
          # only packs that would really work here: 09-branding-schule needs a wallpaper
          assert "09-branding-schule" not in rows[0][2], rows
          out = io.StringIO()
          with contextlib.redirect_stdout(out):
              assert ap.print_loopback_check(allp) is False
          text = out.getvalue()
          assert "12-proxy-student-schule" in text and "default-school" in text, text
          assert "15-lockdown-base" in text and "OU=Devices" in text, text
          assert ap._loopback_gap == {("12-proxy-student-schule", "default-school")}
          # the same run WITH a loopback pack: no gap
          ap = apply.Applier(env, {**proxy, "schools": ["default-school"],
                                   "packs": ["12-proxy-student-schule", "12-proxy-base"]}, dry_run=True)
          ap.eng.find_by_name = lambda name: None
          assert ap.loopback_gap(allp) == [], ap.loopback_gap(allp)
          # ... and with 15-lockdown-base already applied on the DC (not in this run's packs)
          ap = apply.Applier(env, {**proxy, "schools": ["default-school"],
                                   "packs": ["12-proxy-student-schule"]}, dry_run=True)
          ap.eng.find_by_name = lambda name: "{GUID}" if name == "LMN-C-GLOBAL-15-lockdown-base" else None
          assert ap.loopback_gap(allp) == [], ap.loopback_gap(allp)
          # run() must hand the WHOLE catalog to the check, not its own filtered selection -
          # otherwise the "add one of these packs" hint comes out empty (regression 7.3.2).
          ap = apply.Applier(env, {**proxy, "schools": ["default-school"],
                                   "packs": ["12-proxy-student-schule"]}, dry_run=True)
          ap.eng.find_by_name = lambda name: None
          ap.eng.aclcheck = lambda: (True, "")
          ap.apply_pack = lambda *a, **k: None
          out = io.StringIO()
          with contextlib.redirect_stdout(out):
              rc = ap.run(allp)
          text = out.getvalue()
          assert rc == 0, "the loopback gap is a warning, it must not change the exit code"
          assert "Loopback prerequisite" in text, text
          assert "12-proxy-base, 15-lockdown-base" in text, text     # the useful ones first
          # apply_pack is patched out here, so nothing was written - and the summary counts
          # only GPOs that really exist (a held-back or skipped pack never got one)
          assert "cannot reach a user" not in text, text
          # loopback_status names the pack that actually provides it and where it comes from
          ap = apply.Applier(env, {**proxy, "schools": ["default-school"],
                                   "packs": ["12-proxy-student-schule", "15-lockdown-base"]}, dry_run=True)
          ap.eng.find_by_name = lambda name: None
          assert ap.loopback_status(allp) == [("default-school", "15-lockdown-base", "this run")], \
              ap.loopback_status(allp)
          ap = apply.Applier(env, {**proxy, "schools": ["default-school"],
                                   "packs": ["12-proxy-student-schule"]}, dry_run=True)
          ap.eng.find_by_name = lambda name: "{G}" if name == "LMN-C-GLOBAL-12-proxy-base" else None
          assert ap.loopback_status(allp) == [("default-school", "12-proxy-base", "already applied")], \
              ap.loopback_status(allp)
          # --- the VALUE, not just the name: the 7.3.1 upgrade case ---------------------------
          # An existing loopback GPO created by 7.3.1 still carries UserPolicyMode=2 until it
          # is written again. Checking only "a GPO of that name exists" would report green
          # while every client keeps running in Replace - the very situation 7.3.2 is about.
          import os, tempfile
          # python3-samba (and with it the NDR parser for Registry.pol) is not on a
          # GitHub-hosted runner, so the pol READER is stubbed - what is under test here is
          # what apply/doctor do with the value, not samba's parser.
          def fake_pol(mode):
              key = (apply.LOOPBACK_KEY.lower(), apply.LOOPBACK_VALUE.lower())
              return lambda path: {key: (4, mode)} if "GUID" in path else {}
          for mode, want_rows in ((2, 1), (1, 0)):
              apply.regpol_mod._read_pol = fake_pol(mode)
              ap = apply.Applier(env, {**proxy, "schools": ["default-school"],
                                       "packs": ["12-proxy-student-schule"]}, dry_run=True)
              ap.eng.find_by_name = lambda n: "{GUID}" if n == "LMN-C-GLOBAL-15-lockdown-base" else None
              stale = ap.loopback_stale(allp)
              assert len(stale) == want_rows, (mode, stale)
              if want_rows:
                  assert stale[0][:2] == ("15-lockdown-base", "GLOBAL") and stale[0][2:] == (2, 1), stale
                  lines, hint = ap.loopback_stale_text(stale)
                  assert "UserPolicyMode=2" in lines[0] and "Replace" in lines[0], lines
                  assert "apply --yes" in hint[1], hint
                  # the gap check stays quiet (loopback IS on), the value check does not
                  assert ap.loopback_gap(allp) == []
                  out = io.StringIO()
                  with contextlib.redirect_stdout(out):
                      assert ap.print_loopback_check(allp) is False
                  assert "Loopback value" in out.getvalue() and "Replace" in out.getvalue(), out.getvalue()
          # skip_this_run: apply rewrites the pack in this very run, so it must not warn
          apply.regpol_mod._read_pol = fake_pol(2)
          ap = apply.Applier(env, {**proxy, "schools": ["default-school"],
                                   "packs": ["12-proxy-student-schule", "15-lockdown-base"]}, dry_run=True)
          ap.eng.find_by_name = lambda n: "{GUID}" if n == "LMN-C-GLOBAL-15-lockdown-base" else None
          assert ap.loopback_stale(allp, skip_this_run=True) == []
          assert len(ap.loopback_stale(allp)) == 1          # doctor still says it
          # an unreadable/absent Registry.pol must never invent a warning
          apply.regpol_mod._read_pol = lambda path: {}
          ap = apply.Applier(env, {**proxy, "schools": ["default-school"],
                                   "packs": ["12-proxy-student-schule"]}, dry_run=True)
          ap.eng.find_by_name = lambda n: "{GUID}" if n == "LMN-C-GLOBAL-15-lockdown-base" else None
          assert ap.loopback_stale(allp) == []

          # --- the per-GPO line in apply_pack ---------------------------------------------------
          ap = apply.Applier(env, {**proxy, "schools": ["default-school"],
                                   "packs": ["12-proxy-student-schule"]}, dry_run=True)
          ap.eng.find_by_name = lambda n: None
          ap.eng.ensure = lambda name: ("{GUID}", True)      # no samba-tool, no DC
          ap.eng.sysvol_path = lambda g: "/nonexistent"
          ap.eng.link = lambda *a, **k: None
          ap.eng.deny_read = lambda *a, **k: None
          ap.eng.set_exclusive_filter = lambda *a, **k: None
          ap.rp.load = lambda *a, **k: None
          ap.se.apply = lambda *a, **k: None
          ap.gp.add_local_admins = lambda *a, **k: None
          ap._loopback_gap = {("12-proxy-student-schule", "default-school")}
          out = io.StringIO()
          with contextlib.redirect_stdout(out):
              ap.apply_pack(packs["12-proxy-student-schule"], default, [default])
          assert "reach NO user" in out.getvalue(), out.getvalue()
          assert ap.results and ap.results[0]["school"] == "default-school", ap.results
          # a catalog value that is not none/merge/replace must not load at all
          d = tempfile.mkdtemp()
          text = open("catalog/15-lockdown-base.yaml").read().replace("loopback: merge",
                                                                      "loopback: mergee")
          open(os.path.join(d, "15-lockdown-base.yaml"), "w").write(text)
          try:
              catalog.load_packs(d)
              raise SystemExit("::error::a bogus loopback value loaded without complaint")
          except ValueError as exc:
              assert "mergee" in str(exc), exc
          # a global user pack (linked at OU=SCHOOLS, the common ancestor) never needs loopback
          assert not apply.Applier.needs_loopback(packs["15-lockdown-student"])
          # a school pack that carries loopback itself is its own precondition
          assert not apply.Applier.needs_loopback(packs["09-branding-schule"])
          print("loopback prerequisite: ok")
          PY

      - name: PowerShell syntax check (real parser)
        shell: pwsh
        run: |
          # Parse every shipped script with PowerShell's own parser. Static greps cannot
          # catch things like \" -- which is NOT an escape in PowerShell: the backslash
          # stays literal and the quote ENDS the string, so the rest is parsed as code.
          $failed = $false
          $files = @(Get-ChildItem -Path scripts -Filter *.ps1) +
                   @(Get-ChildItem -Path /tmp/gen-ps -Filter *.ps1 -ErrorAction SilentlyContinue)
          foreach ($f in $files) {
              $errors = $null
              [void][System.Management.Automation.Language.Parser]::ParseFile(
                  $f.FullName, [ref]$null, [ref]$errors)
              if ($errors -and $errors.Count) {
                  $failed = $true
                  foreach ($e in $errors) {
                      Write-Host "::error file=scripts/$($f.Name),line=$($e.Extent.StartLineNumber)::$($e.Message)"
                  }
              } else {
                  Write-Host "ok: $($f.Name)"
              }
          }
          if ($failed) { exit 1 }

  resolve:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.image }}
      version: ${{ steps.image.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: image
        run: |
          DIST=$(dpkg-parsechangelog -S Distribution); NUM="${DIST#lmn}"
          if [ "${NUM:-0}" -ge 74 ] 2>/dev/null; then IMG=ghcr.io/linuxmuster/lmndev-runner:latest; else IMG=ghcr.io/linuxmuster/lmndev-runner:24.04; fi
          echo "image=$IMG" >> "$GITHUB_OUTPUT"
          echo "version=$(dpkg-parsechangelog -S Version)" >> "$GITHUB_OUTPUT"

  package:
    needs: resolve
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.resolve.outputs.image }}
      options: --user root
    steps:
      - uses: actions/checkout@v4
      - name: Build package (make deb = dpkg-buildpackage; debhelper and dh-python via build-dep)
        run: |
          apt-get update -qq
          apt-get build-dep -y -qq .
          make deb
          # dpkg-buildpackage writes one level above the source tree.
          mkdir -p output && mv ../*.deb ../*.changes ../*.buildinfo output/
          dpkg-deb -I output/*.deb
          # DEBIAN/md5sums must cover every shipped file, or `dpkg --verify` is a no-op.
          dpkg-deb --ctrl-tarfile output/*.deb | tar -tf - | grep -qx './md5sums'
          test "$(dpkg-deb -c output/*.deb | grep -c '^-')" = "$(dpkg-deb --ctrl-tarfile output/*.deb | tar -xOf - ./md5sums | wc -l)"
          echo "md5sums: $(dpkg-deb --ctrl-tarfile output/*.deb | tar -xOf - ./md5sums | wc -l) files"
      - name: Lintian (the .deb only)
        run: |
          # Never lint the .changes: `lmn73` is not a known distribution, which makes
          # lintian fail with E: bad-distribution-in-changes-file on every single build.
          lintian --fail-on error output/*.deb
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: output/
          if-no-files-found: error

  # The one failure mode of a packaging change that no other job would notice: a catalog
  # YAML, a .ps1 or lib/veyon-default-pub.pem quietly falls out of the package because
  # debian/install matches differently than the old `cp -a`. It would only show up on a
  # school DC, as a pack that is never applied. So every build is compared, path by path,
  # against the newest published release: a path that disappears or changes mode/owner
  # fails the build. This gate is permanent, not just for the debian/ conversion.
  file-tree:
    needs: package
    runs-on: ubuntu-latest        # GitHub-hosted: gh is installed here, not in the container
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: packages/
      - name: Fetch the newest published release
        id: prev
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          mkdir -p previous
          tag=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 20 \
                  --json tagName,isDraft,isPrerelease \
                  --jq '[.[] | select(.isDraft == false and .isPrerelease == false)][0].tagName // ""')
          if [ -z "$tag" ]; then
            echo "skip=1" >> "$GITHUB_OUTPUT"
            echo "::notice::no published release yet, file-tree comparison skipped"
            exit 0
          fi
          for i in 1 2 3; do
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern '*.deb' --dir previous && break
            echo "download attempt $i failed, retrying"; sleep 10
          done
          test -n "$(ls previous/*.deb 2>/dev/null)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Compare the file tree with the released package
        if: steps.prev.outputs.skip != '1'
        env:
          PREV_TAG: ${{ steps.prev.outputs.tag }}
        run: |
          set -euo pipefail          # without pipefail `tee` would swallow the exit code
          # mode owner path, sorted. Directories are compared too: /var/lib/lmn-gpo/wallpapers
          # is shipped EMPTY, so losing it would be invisible in a file-only comparison.
          norm() { dpkg-deb -c "$1" | awk '{print $1, $2, $6}' | LC_ALL=C sort; }
          norm previous/*.deb > old.txt
          norm packages/*.deb > new.txt
          python3 - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import os, sys

          # Paths that may legitimately disappear, with the release that did it. Add an
          # entry ONLY together with the changelog sentence that explains it to admins.
          ALLOW_GONE = {
              # 7.3.3, debhelper conversion: dh_installchangelogs uses the name Debian
              # policy wants for a NATIVE package.
              "usr/share/doc/lmn-gpo/changelog.Debian.gz",
          }

          def read(name):
              rows = {}
              for line in open(name):
                  mode, owner, path = line.rstrip("\n").split(" ", 2)
                  rows[path.removeprefix("./")] = (mode, owner)
              return rows

          old, new = read("old.txt"), read("new.txt")
          gone = sorted(set(old) - set(new))
          added = sorted(set(new) - set(old))
          changed = sorted(p for p in set(old) & set(new) if old[p] != new[p])

          print(f"## File tree vs {os.environ['PREV_TAG']}")
          print()
          print(f"- released: {len(old)} entries, built: {len(new)} entries")
          for p in added:
              print(f"- added: `{p}`")
          for p in gone:
              if p in ALLOW_GONE:
                  print(f"- gone, allowed: `{p}`")
          bad = [p for p in gone if p not in ALLOW_GONE]
          for p in bad:
              print(f"::error::file lost from the package: {p}")
          for p in changed:
              print(f"::error::mode or owner changed: {p}: {old[p]} -> {new[p]}")
          if bad or changed:
              sys.exit(1)
          print()
          print("file tree: nothing lost, no mode or owner change")
          PY
  install-smoke:
    needs: [resolve, package]
    runs-on: ubuntu-24.04              # the target OS (linuxmuster.net 7.3)
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: packages/
      - name: Install and use the package like an admin would
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -eux
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update -qq
          sudo -E apt-get install -y ./packages/*.deb
          test "$(command -v lmn-gpo)" = /usr/bin/lmn-gpo
          lmn-gpo --help
          test "$(lmn-gpo --version)" = "lmn-gpo $VERSION"
          python3 -c 'import lmn_gpo; print("lmn_gpo", lmn_gpo.__version__)'
          test -f /usr/share/lmn-gpo/catalog/19-home-h.yaml
          # every installed file matches the shipped md5sums (silent = ok)
          test -z "$(dpkg --verify lmn-gpo)"
          lmn-gpo --no-color remove --help | grep -q -- '--school'
          # `lmn-gpo doctor` needs a Samba AD DC and is the lab's job, not CI's.

  # Kevin's rule: a release must still install cleanly ON TOP OF the version that is already
  # running on a school server. Be honest about what a runner can prove here: every lmn-gpo
  # subcommand (doctor, env, list, setup, apply, remove, selftest) calls env.detect() ->
  # ad.db() first and exits with rc=2 without /var/lib/samba/private/sam.ldb, even with
  # --dry-run. So this job proves no GPO behaviour -- that is the lab DC's job. It proves the
  # three regression classes that DO live in the package: admin state surviving the upgrade,
  # the config migration branch that is reachable ONLY on an upgrade, and the catalog, which
  # is plain PyYAML and needs no AD at all.
  upgrade-smoke:
    needs: [resolve, package]
    runs-on: ubuntu-24.04
    permissions:
      contents: read        # restrictive org defaults
    env:
      VERSION: ${{ needs.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@v4          # needed for dpkg-parsechangelog and the fixtures
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: packages/
      - name: Fetch the published release to upgrade from
        id: prev
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          mkdir -p previous
          tag="${{ github.event.inputs.prev_tag }}"
          if [ -z "$tag" ]; then
            tag=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 20 \
                    --json tagName,isDraft,isPrerelease \
                    --jq '[.[] | select(.isDraft == false and .isPrerelease == false)][0].tagName // ""')
          fi
          if [ -z "$tag" ]; then
            echo "skip=1" >> "$GITHUB_OUTPUT"
            echo "::notice::no published release yet, upgrade smoke skipped"
            exit 0
          fi
          for i in 1 2 3; do
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern '*.deb' --dir previous && break
            echo "download attempt $i failed, retrying"; sleep 10
          done
          test -n "$(ls previous/*.deb 2>/dev/null)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      # ---- run A: an admin's state on a running server must survive the upgrade ----------
      - name: Run A - install the release and put a real admin state in place
        if: steps.prev.outputs.skip != '1'
        run: |
          set -eux
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update -qq
          sudo -E apt-get install -y ./previous/*.deb
          # site.yaml as `lmn-gpo setup` writes it: dir 0700, file 0600, bind password inside.
          sudo install -d -m 0700 /etc/linuxmuster/lmn-gpo
          sudo tee /etc/linuxmuster/lmn-gpo/site.yaml >/dev/null <<'YAML'
          schools: null
          packs: null
          kmshost: kms.dev.lmschule.de
          kms_port: 1688
          firefox_enabled: true
          firefox_homepage: https://start.dev.lmschule.de
          proxy_enabled: true
          proxy_host: proxy.dev.lmschule.de
          proxy_port_by_role: {teacher: 3128, student: 3128, staff: 3128}
          teachernb: nopxe
          wallpaper_dir: /var/lib/lmn-gpo/wallpapers
          veyon_binddn: CN=global-binduser,OU=Management,DC=dev,DC=lmschule,DC=de
          veyon_bindpw_hex: 4d7573746572213132333435
          wlan_psk_networks:
            - {ssid: Schueler-Netz, psk: passphrase123}
          YAML
          sudo chmod 0600 /etc/linuxmuster/lmn-gpo/site.yaml
          # an admin-provided wallpaper and an own catalog pack, neither of them ours
          sudo install -d -m 0755 /var/lib/lmn-gpo/wallpapers
          printf 'not really a png' | sudo tee /var/lib/lmn-gpo/wallpapers/default-school.png >/dev/null
          sudo tee /usr/share/lmn-gpo/catalog/99-eigen.yaml >/dev/null <<'YAML'
          id: 99-eigen
          title: Site-local pack added by the admin
          scope: global
          target: computer
          registry:
            - keyname: 'Software\Policies\Example'
              valuename: Site
              type: REG_DWORD
              data: 1
              class: MACHINE
          YAML
          # 0700 config dir: everything that touches it needs root, redirections included.
          sudo sha256sum /etc/linuxmuster/lmn-gpo/site.yaml \
                         /var/lib/lmn-gpo/wallpapers/default-school.png \
                         /usr/share/lmn-gpo/catalog/99-eigen.yaml | sudo tee /tmp/before.sha256
          sudo stat -c '%a %U:%G %n' /etc/linuxmuster/lmn-gpo \
                                     /etc/linuxmuster/lmn-gpo/site.yaml | tee /tmp/before.modes
          # the catalog as the INSTALLED old package sees it (pure PyYAML, no AD). -P keeps
          # the checkout's own lmn_gpo/ out of sys.path, otherwise this would read the repo.
          sudo python3 -P - /tmp/catalog-before.json <<'PY'
          import dataclasses, json, sys
          from lmn_gpo import apply, catalog
          packs = catalog.load_packs()
          json.dump({"loopback_mode": apply.LOOPBACK_MODE,
                     "packs": {p.id: dataclasses.asdict(p) for p in packs},
                     "user_policy_mode": {p.id: apply.LOOPBACK_MODE.get(p.loopback)
                                          for p in packs if p.loopback != "none"}},
                    open(sys.argv[1], "w"), indent=1, sort_keys=True, default=str)
          print(len(packs), "packs from", catalog.CATALOG_DIR)
          PY

      - name: Run A - upgrade to the built package and check nothing was lost
        if: steps.prev.outputs.skip != '1'
        run: |
          set -eux
          export DEBIAN_FRONTEND=noninteractive
          # --reinstall --allow-downgrades: on main the build is often version-equal to the
          # release; a plain install would say "already the newest version" and test nothing.
          sudo -E apt-get install -y --reinstall --allow-downgrades ./packages/*.deb
          # admin-owned state: byte-identical AND unchanged permissions
          sudo sha256sum -c /tmp/before.sha256
          sudo stat -c '%a %U:%G %n' /etc/linuxmuster/lmn-gpo \
                                     /etc/linuxmuster/lmn-gpo/site.yaml > /tmp/after.modes
          diff /tmp/before.modes /tmp/after.modes
          test "$(sudo stat -c %a /etc/linuxmuster/lmn-gpo/site.yaml)" = 600
          sudo test -f /var/lib/lmn-gpo/wallpapers/default-school.png
          sudo test -f /usr/share/lmn-gpo/catalog/99-eigen.yaml
          # the package itself
          test "$(lmn-gpo --version)" = "lmn-gpo $VERSION"
          test "$(dpkg-query -W -f='${Version}' lmn-gpo)" = "$VERSION"
          test -z "$(dpkg --verify lmn-gpo)"
          test -z "$(dpkg --audit)"
          sudo apt-get -f install -s | grep -q '0 newly installed'
          # py3compile/py3clean across the version change: no .pyc without its .py
          python3 -P - <<'PY'
          import pathlib, sys
          root = pathlib.Path("/usr/lib/python3/dist-packages/lmn_gpo")
          pycs = sorted(root.rglob("*.pyc"))
          bad = [p for p in pycs if not (p.parents[1] / (p.name.split(".")[0] + ".py")).exists()]
          print(f"bytecode: {len(pycs)} .pyc files")
          for b in bad:
              print(f"::error::orphaned bytecode without a source file: {b}")
          sys.exit(1 if bad else 0)
          PY

      - name: Run A - catalog diff over the upgrade
        if: steps.prev.outputs.skip != '1'
        env:
          PREV_TAG: ${{ steps.prev.outputs.tag }}
        run: |
          set -euo pipefail
          sudo python3 -P - /tmp/catalog-after.json <<'PY'
          import dataclasses, json, sys
          from lmn_gpo import apply, catalog
          packs = catalog.load_packs()
          json.dump({"loopback_mode": apply.LOOPBACK_MODE,
                     "packs": {p.id: dataclasses.asdict(p) for p in packs},
                     "user_policy_mode": {p.id: apply.LOOPBACK_MODE.get(p.loopback)
                                          for p in packs if p.loopback != "none"}},
                    open(sys.argv[1], "w"), indent=1, sort_keys=True, default=str)
          PY
          # The catalog is what actually reaches the clients. The diff is informational -- a
          # release is allowed to change packs -- and goes into the job summary ...
          {
            echo "## Catalog diff $PREV_TAG -> $VERSION"
            echo
            echo '```diff'
            diff -u /tmp/catalog-before.json /tmp/catalog-after.json || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # ... but the effective UserPolicyMode per pack is asserted hard. 7.3.1 shipped
          # LOOPBACK_MODE inverted (merge -> 2), which put every managed client into Replace
          # and silently dropped the GPOs linked in the user's own OU path. Nothing else in
          # CI would have made that visible.
          python3 -P - <<'PY'
          import json, sys
          before = json.load(open("/tmp/catalog-before.json"))
          after = json.load(open("/tmp/catalog-after.json"))
          rc = 0
          if after["loopback_mode"] != {"merge": 1, "replace": 2}:
              print(f"::error::LOOPBACK_MODE is {after['loopback_mode']}; Microsoft's values are "
                    "merge=1, replace=2 (GroupPolicy.admx, client event 5311)")
              rc = 1
          for pack, mode in sorted(after["user_policy_mode"].items()):
              was = before["user_policy_mode"].get(pack)
              if mode == 2:
                  # No pack in the catalog needs Replace, and Replace silently drops every
                  # GPO linked in the user's own OU path on a managed client.
                  print(f"::error::{pack}: UserPolicyMode=2 (Replace) drops the user's own GPOs")
                  rc = 1
                  continue
              if was is not None and was != mode:
                  # Not an error: 7.3.2 legitimately changed 2 -> 1. The value itself is
                  # checked above, so a change only has to be seen, not blocked.
                  print(f"::notice::{pack}: UserPolicyMode changed {was} -> {mode} in this upgrade")
              print(f"loopback ok: {pack} -> UserPolicyMode={mode}")
          sys.exit(rc)
          PY

      # ---- run B: the migration branch, reachable ONLY through an upgrade ----------------
      - name: Run B - the legacy config path is migrated on upgrade
        if: steps.prev.outputs.skip != '1'
        run: |
          set -eux
          export DEBIAN_FRONTEND=noninteractive
          sudo -E apt-get purge -y lmn-gpo
          sudo rm -rf /etc/linuxmuster/lmn-gpo /etc/linuxmuster/lmgpo /var/lib/lmn-gpo
          sudo -E apt-get install -y ./previous/*.deb
          # a server that still sits on the pre-rename config path
          sudo rm -rf /etc/linuxmuster/lmn-gpo
          sudo install -d -m 0700 /etc/linuxmuster/lmgpo
          printf 'kmshost: kms.dev.lmschule.de\nveyon_bindpw_hex: 4d757374657221\n' \
            | sudo tee /etc/linuxmuster/lmgpo/site.yaml >/dev/null
          sudo chmod 0600 /etc/linuxmuster/lmgpo/site.yaml
          sudo sha256sum /etc/linuxmuster/lmgpo/site.yaml | sudo tee /tmp/legacy.sha256
          sudo -E apt-get install -y --reinstall --allow-downgrades ./packages/*.deb
          # migrated, tightened to 0600, legacy path removed
          sudo test -f /etc/linuxmuster/lmn-gpo/site.yaml
          test "$(sudo stat -c %a /etc/linuxmuster/lmn-gpo/site.yaml)" = 600
          test "$(sudo sha256sum /etc/linuxmuster/lmn-gpo/site.yaml | cut -d' ' -f1)" \
             = "$(cut -d' ' -f1 /tmp/legacy.sha256)"
          test ! -e /etc/linuxmuster/lmgpo/site.yaml
          test ! -d /etc/linuxmuster/lmgpo
          test -z "$(dpkg --verify lmn-gpo)"
          test -z "$(dpkg --audit)"
