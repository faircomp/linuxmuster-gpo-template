# From linuxmusterDEV/templates/release.yml, modeled on lmndev-runner/workflows/*.release.yml.
# Cut a release by pushing a version tag:
#   git tag v7.3.0 && git push origin v7.3.0
# The tag (minus the leading "v") must equal the top entry of debian/changelog, the single
# version source. The release is gated on the same install AND upgrade smoke as ci.yml, so no
# tag can be published that does not install on top of the version a school already runs.
# A manual run (workflow_dispatch) only builds, smokes and uploads the .deb.
# No publish job yet (no faircomp/deb archive). Since the debian/ conversion the build also
# produces a .changes file, which is attached to the release next to the .deb.
name: release

on:
  push:
    tags: ['v[0-9]*']
  workflow_dispatch:
    inputs:
      prev_tag:
        description: 'upgrade smoke: tag to upgrade from (empty = newest published release)'
        required: false
        default: ''

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: |
          VERSION=$(dpkg-parsechangelog -S Version)
          DIST=$(dpkg-parsechangelog -S Distribution); NUM="${DIST#lmn}"
          TAGVER="${GITHUB_REF_NAME#v}"; TAGVER="${TAGVER//-rc/~rc}"   # v7.3.1-rc1 -> 7.3.1~rc1
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$TAGVER" != "$VERSION" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match debian/changelog version $VERSION"; exit 1; fi
          if [ "${NUM:-0}" -ge 74 ] 2>/dev/null; then IMG=ghcr.io/linuxmuster/lmndev-runner:latest; else IMG=ghcr.io/linuxmuster/lmndev-runner:24.04; fi
          echo "image=$IMG" >> "$GITHUB_OUTPUT"; echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  build:
    needs: gate
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.gate.outputs.image }}
      options: --user root
    steps:
      - uses: actions/checkout@v4
      - name: Build package (make deb = dpkg-buildpackage; debhelper and dh-python via build-dep)
        run: |
          apt-get update -qq
          apt-get build-dep -y -qq .
          make deb
          # dpkg-buildpackage writes one level above the source tree.
          mkdir -p output && mv ../*.deb ../*.changes ../*.buildinfo output/
          dpkg-deb -I output/*.deb
          # The .deb only: `lmn73` is not a distribution lintian knows, so linting the
          # .changes would fail every build with E: bad-distribution-in-changes-file.
          lintian --fail-on error output/*.deb
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: output/
          if-no-files-found: error

  install-smoke:
    needs: [gate, build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: packages/
      - name: Install and use the package like an admin would (same as ci.yml)
        env:
          VERSION: ${{ needs.gate.outputs.version }}
        run: |
          set -eux
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update -qq
          sudo -E apt-get install -y ./packages/*.deb
          test "$(command -v lmn-gpo)" = /usr/bin/lmn-gpo
          lmn-gpo --help
          test "$(lmn-gpo --version)" = "lmn-gpo $VERSION"
          python3 -c 'import lmn_gpo; print("lmn_gpo", lmn_gpo.__version__)'
          test -f /usr/share/lmn-gpo/catalog/19-home-h.yaml

  # Kevin's rule: a release must still install cleanly ON TOP OF the version that is already
  # running on a school server. Be honest about what a runner can prove here: every lmn-gpo
  # subcommand (doctor, env, list, setup, apply, remove, selftest) calls env.detect() ->
  # ad.db() first and exits with rc=2 without /var/lib/samba/private/sam.ldb, even with
  # --dry-run. So this job proves no GPO behaviour -- that is the lab DC's job. It proves the
  # three regression classes that DO live in the package: admin state surviving the upgrade,
  # the config migration branch that is reachable ONLY on an upgrade, and the catalog, which
  # is plain PyYAML and needs no AD at all.
  upgrade-smoke:
    needs: [gate, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: read        # restrictive org defaults
    env:
      VERSION: ${{ needs.gate.outputs.version }}
    steps:
      - uses: actions/checkout@v4          # needed for dpkg-parsechangelog and the fixtures
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: packages/
      - name: Fetch the published release to upgrade from
        id: prev
        env:
          GH_TOKEN: ${{ github.token }}
          # Through env, never interpolated into the script: a ${{ }} expression in a run
          # block is substituted before the shell sees it, so its content could inject code.
          PREV_TAG: ${{ github.event.inputs.prev_tag }}
        run: |
          set -eu
          mkdir -p previous
          tag="${PREV_TAG:-}"
          if [ -z "$tag" ]; then
            # Prefer the newest real release; fall back to the newest prerelease. Skipping is
            # only legitimate when the repo has NO release at all: this job gates the release
            # job, so a silent skip would publish a tag whose upgrade path was never tested.
            tag=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 30 \
                    --json tagName,isDraft,isPrerelease \
                    --jq '[.[] | select(.isDraft == false and .isPrerelease == false)][0].tagName // ""')
            if [ -z "$tag" ]; then
              tag=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 30 \
                      --json tagName,isDraft --jq '[.[] | select(.isDraft == false)][0].tagName // ""')
              [ -n "$tag" ] && echo "::warning::no full release yet, upgrading from prerelease $tag"
            fi
          fi
          if [ -z "$tag" ]; then
            if [ "$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1 --json tagName --jq 'length')" != "0" ]; then
              echo "::error::releases exist but none could be selected - refusing to skip"; exit 1
            fi
            echo "skip=1" >> "$GITHUB_OUTPUT"
            echo "::notice::first release of this package, nothing to upgrade from"
            exit 0
          fi
          for i in 1 2 3; do
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern '*.deb' --dir previous && break
            echo "download attempt $i failed, retrying"; sleep 10
          done
          test -n "$(ls previous/*.deb 2>/dev/null)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      # ---- run A: an admin's state on a running server must survive the upgrade ----------
      - name: Run A - install the release and put a real admin state in place
        if: steps.prev.outputs.skip != '1'
        run: |
          set -eux
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update -qq
          sudo -E apt-get install -y ./previous/*.deb
          # site.yaml as `lmn-gpo setup` writes it: dir 0700, file 0600, bind password inside.
          sudo install -d -m 0700 /etc/linuxmuster/lmn-gpo
          sudo tee /etc/linuxmuster/lmn-gpo/site.yaml >/dev/null <<'YAML'
          schools: null
          packs: null
          kmshost: kms.dev.lmschule.de
          kms_port: 1688
          firefox_enabled: true
          firefox_homepage: https://start.dev.lmschule.de
          proxy_enabled: true
          proxy_host: proxy.dev.lmschule.de
          proxy_port_by_role: {teacher: 3128, student: 3128, staff: 3128}
          teachernb: nopxe
          wallpaper_dir: /var/lib/lmn-gpo/wallpapers
          veyon_binddn: CN=global-binduser,OU=Management,DC=dev,DC=lmschule,DC=de
          veyon_bindpw_hex: 4d7573746572213132333435
          wlan_psk_networks:
            - {ssid: Schueler-Netz, psk: passphrase123}
          YAML
          sudo chmod 0600 /etc/linuxmuster/lmn-gpo/site.yaml
          # an admin-provided wallpaper and an own catalog pack, neither of them ours
          sudo install -d -m 0755 /var/lib/lmn-gpo/wallpapers
          printf 'not really a png' | sudo tee /var/lib/lmn-gpo/wallpapers/default-school.png >/dev/null
          sudo tee /usr/share/lmn-gpo/catalog/99-eigen.yaml >/dev/null <<'YAML'
          id: 99-eigen
          title: Site-local pack added by the admin
          scope: global
          target: computer
          registry:
            - keyname: 'Software\Policies\Example'
              valuename: Site
              type: REG_DWORD
              data: 1
              class: MACHINE
          YAML
          # 0700 config dir: everything that touches it needs root, redirections included.
          sudo sha256sum /etc/linuxmuster/lmn-gpo/site.yaml \
                         /var/lib/lmn-gpo/wallpapers/default-school.png \
                         /usr/share/lmn-gpo/catalog/99-eigen.yaml | sudo tee /tmp/before.sha256
          sudo stat -c '%a %U:%G %n' /etc/linuxmuster/lmn-gpo \
                                     /etc/linuxmuster/lmn-gpo/site.yaml | tee /tmp/before.modes
          # the catalog as the INSTALLED old package sees it (pure PyYAML, no AD). -P keeps
          # the checkout's own lmn_gpo/ out of sys.path, otherwise this would read the repo.
          sudo python3 -P - /tmp/catalog-before.json <<'PY'
          import dataclasses, json, sys
          from lmn_gpo import apply, catalog
          packs = catalog.load_packs()
          json.dump({"loopback_mode": apply.LOOPBACK_MODE,
                     "packs": {p.id: dataclasses.asdict(p) for p in packs},
                     "user_policy_mode": {p.id: apply.LOOPBACK_MODE.get(p.loopback)
                                          for p in packs if p.loopback != "none"}},
                    open(sys.argv[1], "w"), indent=1, sort_keys=True, default=str)
          print(len(packs), "packs from", catalog.CATALOG_DIR)
          PY

      - name: Run A - upgrade to the built package and check nothing was lost
        if: steps.prev.outputs.skip != '1'
        run: |
          set -eux
          export DEBIAN_FRONTEND=noninteractive
          # --reinstall --allow-downgrades: on main the build is often version-equal to the
          # release; a plain install would say "already the newest version" and test nothing.
          sudo -E apt-get install -y --reinstall --allow-downgrades ./packages/*.deb
          # admin-owned state: byte-identical AND unchanged permissions
          sudo sha256sum -c /tmp/before.sha256
          sudo stat -c '%a %U:%G %n' /etc/linuxmuster/lmn-gpo \
                                     /etc/linuxmuster/lmn-gpo/site.yaml > /tmp/after.modes
          diff /tmp/before.modes /tmp/after.modes
          test "$(sudo stat -c %a /etc/linuxmuster/lmn-gpo/site.yaml)" = 600
          sudo test -f /var/lib/lmn-gpo/wallpapers/default-school.png
          sudo test -f /usr/share/lmn-gpo/catalog/99-eigen.yaml
          # the package itself
          test "$(lmn-gpo --version)" = "lmn-gpo $VERSION"
          test "$(dpkg-query -W -f='${Version}' lmn-gpo)" = "$VERSION"
          test -z "$(dpkg --verify lmn-gpo)"
          test -z "$(dpkg --audit)"
          sudo apt-get -f install -s | grep -q '0 newly installed'
          # py3compile/py3clean across the version change: no .pyc without its .py
          python3 -P - <<'PY'
          import pathlib, sys
          root = pathlib.Path("/usr/lib/python3/dist-packages/lmn_gpo")
          pycs = sorted(root.rglob("*.pyc"))
          bad = [p for p in pycs if not (p.parents[1] / (p.name.split(".")[0] + ".py")).exists()]
          print(f"bytecode: {len(pycs)} .pyc files")
          for b in bad:
              print(f"::error::orphaned bytecode without a source file: {b}")
          sys.exit(1 if bad else 0)
          PY

      - name: Run A - catalog diff over the upgrade
        if: steps.prev.outputs.skip != '1'
        env:
          PREV_TAG: ${{ steps.prev.outputs.tag }}
        run: |
          set -euo pipefail
          sudo python3 -P - /tmp/catalog-after.json <<'PY'
          import dataclasses, json, sys
          from lmn_gpo import apply, catalog
          packs = catalog.load_packs()
          json.dump({"loopback_mode": apply.LOOPBACK_MODE,
                     "packs": {p.id: dataclasses.asdict(p) for p in packs},
                     "user_policy_mode": {p.id: apply.LOOPBACK_MODE.get(p.loopback)
                                          for p in packs if p.loopback != "none"}},
                    open(sys.argv[1], "w"), indent=1, sort_keys=True, default=str)
          PY
          # The catalog is what actually reaches the clients. The diff is informational -- a
          # release is allowed to change packs -- and goes into the job summary ...
          {
            echo "## Catalog diff $PREV_TAG -> $VERSION"
            echo
            echo '```diff'
            diff -u /tmp/catalog-before.json /tmp/catalog-after.json || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # ... but the effective UserPolicyMode per pack is asserted hard. 7.3.1 shipped
          # LOOPBACK_MODE inverted (merge -> 2), which put every managed client into Replace
          # and silently dropped the GPOs linked in the user's own OU path. Nothing else in
          # CI would have made that visible.
          python3 -P - <<'PY'
          import json, sys
          before = json.load(open("/tmp/catalog-before.json"))
          after = json.load(open("/tmp/catalog-after.json"))
          rc = 0
          if after["loopback_mode"] != {"merge": 1, "replace": 2}:
              print(f"::error::LOOPBACK_MODE is {after['loopback_mode']}; Microsoft's values are "
                    "merge=1, replace=2 (GroupPolicy.admx, client event 5311)")
              rc = 1
          if not after["user_policy_mode"]:
              # An empty set would satisfy every assertion below without checking anything.
              print("::error::no pack declares loopback any more - the catalog lost its "
                    "loopback packs, or load_packs() returned nothing")
              rc = 1
          for pack in sorted(set(before["user_policy_mode"]) - set(after["user_policy_mode"])):
              print(f"::error::{pack} declared loopback before the upgrade and does not any "
                    "more - the per-school user packs would stop reaching users")
              rc = 1
          for pack, mode in sorted(after["user_policy_mode"].items()):
              was = before["user_policy_mode"].get(pack)
              if mode == 2:
                  # No pack in the catalog needs Replace, and Replace silently drops every
                  # GPO linked in the user's own OU path on a managed client.
                  print(f"::error::{pack}: UserPolicyMode=2 (Replace) drops the user's own GPOs")
                  rc = 1
                  continue
              if was is not None and was != mode:
                  # Not an error: 7.3.2 legitimately changed 2 -> 1. The value itself is
                  # checked above, so a change only has to be seen, not blocked.
                  print(f"::notice::{pack}: UserPolicyMode changed {was} -> {mode} in this upgrade")
              print(f"loopback ok: {pack} -> UserPolicyMode={mode}")
          sys.exit(rc)
          PY

      # ---- run B: the migration branch, reachable ONLY through an upgrade ----------------
      - name: Run B - the legacy config path is migrated on upgrade
        if: steps.prev.outputs.skip != '1'
        run: |
          set -eux
          export DEBIAN_FRONTEND=noninteractive
          # The state from run A is still in place here, so purge is asserted, not just run.
          # `apt purge` deleting site.yaml would be the most expensive regression for a
          # school: it holds the bind password and is not backed up by dpkg anywhere.
          sudo -E apt-get purge -y lmn-gpo
          sudo test -f /etc/linuxmuster/lmn-gpo/site.yaml
          test "$(sudo stat -c %a /etc/linuxmuster/lmn-gpo/site.yaml)" = 600
          sudo test ! -e /var/lib/lmn-gpo
          sudo test ! -e /usr/lib/python3/dist-packages/lmn_gpo
          sudo test ! -e /usr/bin/lmn-gpo
          sudo rm -rf /etc/linuxmuster/lmn-gpo /etc/linuxmuster/lmgpo /var/lib/lmn-gpo
          sudo -E apt-get install -y ./previous/*.deb
          # a server that still sits on the pre-rename config path
          sudo rm -rf /etc/linuxmuster/lmn-gpo
          sudo install -d -m 0700 /etc/linuxmuster/lmgpo
          printf 'kmshost: kms.dev.lmschule.de\nveyon_bindpw_hex: 4d757374657221\n' \
            | sudo tee /etc/linuxmuster/lmgpo/site.yaml >/dev/null
          sudo chmod 0600 /etc/linuxmuster/lmgpo/site.yaml
          sudo sha256sum /etc/linuxmuster/lmgpo/site.yaml | sudo tee /tmp/legacy.sha256
          sudo -E apt-get install -y --reinstall --allow-downgrades ./packages/*.deb
          # migrated, tightened to 0600, legacy path removed
          sudo test -f /etc/linuxmuster/lmn-gpo/site.yaml
          test "$(sudo stat -c %a /etc/linuxmuster/lmn-gpo/site.yaml)" = 600
          test "$(sudo sha256sum /etc/linuxmuster/lmn-gpo/site.yaml | cut -d' ' -f1)" \
             = "$(cut -d' ' -f1 /tmp/legacy.sha256)"
          test ! -e /etc/linuxmuster/lmgpo/site.yaml
          test ! -d /etc/linuxmuster/lmgpo
          test -z "$(dpkg --verify lmn-gpo)"
          test -z "$(dpkg --audit)"

  release:
    needs: [gate, build, install-smoke, upgrade-smoke]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: packages/
      - name: Release notes with install instructions and the SHA256 (kept from the old workflow)
        run: |
          DEB=$(ls packages/*.deb)
          BASE=$(basename "$DEB")
          SHA=$(sha256sum "$DEB" | cut -d' ' -f1)
          {
            echo "## lmn-gpo ${GITHUB_REF_NAME}"
            echo ""
            echo "Debian package (\`Architecture: all\`) of the linuxmuster.net GPO template"
            echo "toolkit, for the Samba AD domain controller (linuxmuster.net 7.3, Ubuntu 24.04)."
            echo ""
            echo "### Install"
            echo '```bash'
            echo "apt install ./${BASE}      # or: dpkg -i ${BASE}"
            echo "lmn-gpo doctor"
            echo '```'
            echo ""
            echo "Installs entirely inside its own \`lmn-gpo\` namespace (no linuxmuster files"
            echo "touched) and reads its config from \`/etc/linuxmuster/lmn-gpo/site.yaml\` —"
            echo "migrated on install, kept on upgrade/remove. Changes: see \`debian/changelog\`."
            echo ""
            echo "\`SHA256: ${SHA}\`"
          } > notes.md
      - uses: softprops/action-gh-release@v2
        with:
          name: lmn-gpo ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, '-rc') }}
          body_path: notes.md
          files: |
            packages/*.deb
            packages/*.changes
          generate_release_notes: true      # appended below the notes above
