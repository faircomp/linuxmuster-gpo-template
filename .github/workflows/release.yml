# From linuxmusterDEV/templates/release.yml, modeled on lmndev-runner/workflows/*.release.yml.
# Cut a release by pushing a version tag:
#   git tag v7.3.0 && git push origin v7.3.0
# The tag (minus the leading "v") must equal the top entry of debian/changelog, the single
# version source. The release is gated on the same install AND upgrade smoke as ci.yml, so no
# tag can be published that does not install on top of the version a school already runs.
# A manual run (workflow_dispatch) only builds, smokes and uploads the .deb. Since the
# debian/ conversion the build produces a .changes; the release carries it together with
# every file it lists (.deb, .dsc, source tarball, .buildinfo), so the .changes never names a
# file nobody can download. No publish job yet (no faircomp/deb archive).
#
# Supply chain (hub templates/release.yml, stage A): build image by digest and every action by
# commit SHA (same pins as ci.yml), no third-party release action next to `contents: write`.
# The release is created as a DRAFT, all assets are uploaded and compared by sha256 with the
# build, and only then published: GitHub immutable releases freeze tag and assets on publish,
# so a release published first could not receive its assets afterwards. A failed run leaves
# a draft that a re-run completes.
# Immutable or not at all: right before publishing, while the release is still a draft, the
# job checks that immutable releases are on for this repo, and after publishing it re-reads the
# release and fails unless `immutable` is true. The setting only acts on releases published after
# it was switched on (7.3.4 and older came out mutable while the run stayed green). GITHUB_TOKEN
# cannot read the setting: the endpoint needs the Administration permission, which no
# GITHUB_TOKEN can hold (HTTP 403 even with `permissions: write-all`). The repo secret
# IMMUTABLE_CHECK_TOKEN therefore holds a fine-grained token for this repo with only
# "Administration: Read-only"; without it the release stays a draft.
name: release

on:
  push:
    tags: ['v[0-9]*']
  workflow_dispatch:
    inputs:
      prev_tag:
        description: 'upgrade smoke: tag to upgrade from (empty = newest published release)'
        required: false
        default: ''

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - id: meta
        run: |
          VERSION=$(dpkg-parsechangelog -S Version)
          DIST=$(dpkg-parsechangelog -S Distribution); NUM="${DIST#lmn}"
          TAGVER="${GITHUB_REF_NAME#v}"; TAGVER="${TAGVER//-rc/~rc}"   # v7.3.1-rc1 -> 7.3.1~rc1
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$TAGVER" != "$VERSION" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match debian/changelog version $VERSION"; exit 1; fi
          # Pinned by digest (see the header); Renovate bumps both lines here and in ci.yml.
          IMG_LMN73=ghcr.io/linuxmuster/lmndev-runner:24.04@sha256:6b0c8ac994cf1d2da44b0b36ebd7b3b125094886e78293e04b9db5e515b8209e
          IMG_LMN74=ghcr.io/linuxmuster/lmndev-runner:latest@sha256:d735e6ccc6fd9df71b2552b06ac6f5cb4bf2d03f40e14bafe47213325b7b801b
          if [ "${NUM:-0}" -ge 74 ] 2>/dev/null; then IMG=$IMG_LMN74; else IMG=$IMG_LMN73; fi
          echo "image=$IMG" >> "$GITHUB_OUTPUT"; echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  build:
    needs: gate
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.gate.outputs.image }}
      options: --user root
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build package (make deb = dpkg-buildpackage; debhelper and dh-python via build-dep)
        run: |
          apt-get update -qq
          apt-get build-dep -y -qq .
          make deb
          # dpkg-buildpackage writes one level above the source tree. The .dsc and the
          # source tarball go along because the .changes lists them with their checksums;
          # attaching the .changes alone would point at files nobody can download.
          mkdir -p output && mv ../*.deb ../*.changes ../*.buildinfo ../*.dsc ../*.tar.* output/
          dpkg-deb -I output/*.deb
          # DEBIAN/md5sums must cover every shipped file, or `dpkg --verify` is a no-op.
          dpkg-deb --ctrl-tarfile output/*.deb | tar -tf - | grep -qx './md5sums'
          test "$(dpkg-deb -c output/*.deb | grep -c '^-')" = "$(dpkg-deb --ctrl-tarfile output/*.deb | tar -xOf - ./md5sums | wc -l)"
          # The .deb only: `lmn73` is not a distribution lintian knows, so linting the
          # .changes would fail every build with E: bad-distribution-in-changes-file.
          lintian --fail-on error output/*.deb
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: packages
          path: output/
          if-no-files-found: error

  install-smoke:
    needs: [gate, build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: packages
          path: packages/
      - name: Install and use the package like an admin would (same as ci.yml)
        env:
          VERSION: ${{ needs.gate.outputs.version }}
        run: |
          set -eux
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update -qq
          sudo -E apt-get install -y ./packages/*.deb
          test "$(command -v lmn-gpo)" = /usr/bin/lmn-gpo
          lmn-gpo --help
          test "$(lmn-gpo --version)" = "lmn-gpo $VERSION"
          python3 -c 'import lmn_gpo; print("lmn_gpo", lmn_gpo.__version__)'
          test -f /usr/share/lmn-gpo/catalog/19-home-h.yaml
          # every installed file matches the shipped md5sums (silent = ok)
          test -z "$(dpkg --verify lmn-gpo)"
          lmn-gpo --no-color remove --help | grep -q -- '--school'
          # `lmn-gpo doctor` needs a Samba AD DC and is the lab's job, not CI's.

  # Kevin's rule: a release must still install cleanly ON TOP OF the version that is already
  # running on a school server. Be honest about what a runner can prove here: every lmn-gpo
  # subcommand (doctor, env, list, setup, apply, remove, selftest) calls env.detect() ->
  # ad.db() first and exits with rc=2 without /var/lib/samba/private/sam.ldb, even with
  # --dry-run. So this job proves no GPO behaviour -- that is the lab DC's job. It proves the
  # three regression classes that DO live in the package: admin state surviving the upgrade,
  # the config migration branch that is reachable ONLY on an upgrade, and the catalog, which
  # is plain PyYAML and needs no AD at all.
  upgrade-smoke:
    needs: [gate, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: read        # restrictive org defaults
    env:
      VERSION: ${{ needs.gate.outputs.version }}
    steps:
      # needed for dpkg-parsechangelog and the fixtures
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: packages
          path: packages/
      - name: Fetch the published release to upgrade from
        id: prev
        env:
          GH_TOKEN: ${{ github.token }}
          # Through env, never interpolated into the script: a ${{ }} expression in a run
          # block is substituted before the shell sees it, so its content could inject code.
          PREV_TAG: ${{ github.event.inputs.prev_tag }}
        run: |
          set -eu
          mkdir -p previous
          tag="${PREV_TAG:-}"
          if [ -z "$tag" ]; then
            # Prefer the newest real release; fall back to the newest prerelease. Skipping is
            # only legitimate when the repo has NO release at all: this job gates the release
            # job, so a silent skip would publish a tag whose upgrade path was never tested.
            tag=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 30 \
                    --json tagName,isDraft,isPrerelease \
                    --jq '[.[] | select(.isDraft == false and .isPrerelease == false)][0].tagName // ""')
            if [ -z "$tag" ]; then
              tag=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 30 \
                      --json tagName,isDraft --jq '[.[] | select(.isDraft == false)][0].tagName // ""')
              [ -n "$tag" ] && echo "::warning::no full release yet, upgrading from prerelease $tag"
            fi
          fi
          if [ -z "$tag" ]; then
            if [ "$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1 --json tagName --jq 'length')" != "0" ]; then
              echo "::error::releases exist but none could be selected - refusing to skip"; exit 1
            fi
            echo "skip=1" >> "$GITHUB_OUTPUT"
            echo "::notice::first release of this package, nothing to upgrade from"
            exit 0
          fi
          for i in 1 2 3; do
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern '*.deb' --dir previous && break
            echo "download attempt $i failed, retrying"; sleep 10
          done
          test -n "$(ls previous/*.deb 2>/dev/null)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      # ---- run A: an admin's state on a running server must survive the upgrade ----------
      - name: Run A - install the release and put a real admin state in place
        if: steps.prev.outputs.skip != '1'
        run: |
          set -eux
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update -qq
          sudo -E apt-get install -y ./previous/*.deb
          # site.yaml as `lmn-gpo setup` writes it: dir 0700, file 0600, bind password inside.
          sudo install -d -m 0700 /etc/linuxmuster/lmn-gpo
          sudo tee /etc/linuxmuster/lmn-gpo/site.yaml >/dev/null <<'YAML'
          schools: null
          packs: null
          kmshost: kms.dev.lmschule.de
          kms_port: 1688
          firefox_enabled: true
          firefox_homepage: https://start.dev.lmschule.de
          proxy_enabled: true
          proxy_host: proxy.dev.lmschule.de
          proxy_port_by_role: {teacher: 3128, student: 3128, staff: 3128}
          teachernb: nopxe
          wallpaper_dir: /var/lib/lmn-gpo/wallpapers
          veyon_binddn: CN=global-binduser,OU=Management,DC=dev,DC=lmschule,DC=de
          veyon_bindpw_hex: 4d7573746572213132333435
          wlan_psk_networks:
            - {ssid: Schueler-Netz, psk: passphrase123}
          YAML
          sudo chmod 0600 /etc/linuxmuster/lmn-gpo/site.yaml
          # an admin-provided wallpaper and an own catalog pack, neither of them ours
          sudo install -d -m 0755 /var/lib/lmn-gpo/wallpapers
          printf 'not really a png' | sudo tee /var/lib/lmn-gpo/wallpapers/default-school.png >/dev/null
          sudo tee /usr/share/lmn-gpo/catalog/99-eigen.yaml >/dev/null <<'YAML'
          id: 99-eigen
          title: Site-local pack added by the admin
          scope: global
          target: computer
          registry:
            - keyname: 'Software\Policies\Example'
              valuename: Site
              type: REG_DWORD
              data: 1
              class: MACHINE
          YAML
          # 0700 config dir: everything that touches it needs root, redirections included.
          sudo sha256sum /etc/linuxmuster/lmn-gpo/site.yaml \
                         /var/lib/lmn-gpo/wallpapers/default-school.png \
                         /usr/share/lmn-gpo/catalog/99-eigen.yaml | sudo tee /tmp/before.sha256
          sudo stat -c '%a %U:%G %n' /etc/linuxmuster/lmn-gpo \
                                     /etc/linuxmuster/lmn-gpo/site.yaml | tee /tmp/before.modes
          # the catalog as the INSTALLED old package sees it (pure PyYAML, no AD). -P keeps
          # the checkout's own lmn_gpo/ out of sys.path, otherwise this would read the repo.
          sudo python3 -P - /tmp/catalog-before.json <<'PY'
          import dataclasses, json, sys
          from lmn_gpo import apply, catalog
          packs = catalog.load_packs()
          json.dump({"loopback_mode": apply.LOOPBACK_MODE,
                     "packs": {p.id: dataclasses.asdict(p) for p in packs},
                     "user_policy_mode": {p.id: apply.LOOPBACK_MODE.get(p.loopback)
                                          for p in packs if p.loopback != "none"}},
                    open(sys.argv[1], "w"), indent=1, sort_keys=True, default=str)
          print(len(packs), "packs from", catalog.CATALOG_DIR)
          PY

      - name: Run A - upgrade to the built package and check nothing was lost
        if: steps.prev.outputs.skip != '1'
        run: |
          set -eux
          export DEBIAN_FRONTEND=noninteractive
          # --reinstall --allow-downgrades: on main the build is often version-equal to the
          # release; a plain install would say "already the newest version" and test nothing.
          sudo -E apt-get install -y --reinstall --allow-downgrades ./packages/*.deb
          # admin-owned state: byte-identical AND unchanged permissions
          sudo sha256sum -c /tmp/before.sha256
          sudo stat -c '%a %U:%G %n' /etc/linuxmuster/lmn-gpo \
                                     /etc/linuxmuster/lmn-gpo/site.yaml > /tmp/after.modes
          diff /tmp/before.modes /tmp/after.modes
          test "$(sudo stat -c %a /etc/linuxmuster/lmn-gpo/site.yaml)" = 600
          sudo test -f /var/lib/lmn-gpo/wallpapers/default-school.png
          sudo test -f /usr/share/lmn-gpo/catalog/99-eigen.yaml
          # the package itself
          test "$(lmn-gpo --version)" = "lmn-gpo $VERSION"
          test "$(dpkg-query -W -f='${Version}' lmn-gpo)" = "$VERSION"
          test -z "$(dpkg --verify lmn-gpo)"
          test -z "$(dpkg --audit)"
          sudo apt-get -f install -s | grep -q '0 newly installed'
          # py3compile/py3clean across the version change: no .pyc without its .py
          python3 -P - <<'PY'
          import pathlib, sys
          root = pathlib.Path("/usr/lib/python3/dist-packages/lmn_gpo")
          pycs = sorted(root.rglob("*.pyc"))
          bad = [p for p in pycs if not (p.parents[1] / (p.name.split(".")[0] + ".py")).exists()]
          print(f"bytecode: {len(pycs)} .pyc files")
          for b in bad:
              print(f"::error::orphaned bytecode without a source file: {b}")
          sys.exit(1 if bad else 0)
          PY

      - name: Run A - catalog diff over the upgrade
        if: steps.prev.outputs.skip != '1'
        env:
          PREV_TAG: ${{ steps.prev.outputs.tag }}
        run: |
          set -euo pipefail
          sudo python3 -P - /tmp/catalog-after.json <<'PY'
          import dataclasses, json, sys
          from lmn_gpo import apply, catalog
          packs = catalog.load_packs()
          json.dump({"loopback_mode": apply.LOOPBACK_MODE,
                     "packs": {p.id: dataclasses.asdict(p) for p in packs},
                     "user_policy_mode": {p.id: apply.LOOPBACK_MODE.get(p.loopback)
                                          for p in packs if p.loopback != "none"}},
                    open(sys.argv[1], "w"), indent=1, sort_keys=True, default=str)
          PY
          # The catalog is what actually reaches the clients. The diff is informational -- a
          # release is allowed to change packs -- and goes into the job summary ...
          {
            echo "## Catalog diff $PREV_TAG -> $VERSION"
            echo
            echo '```diff'
            diff -u /tmp/catalog-before.json /tmp/catalog-after.json || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # ... but the effective UserPolicyMode per pack is asserted hard. 7.3.1 shipped
          # LOOPBACK_MODE inverted (merge -> 2), which put every managed client into Replace
          # and silently dropped the GPOs linked in the user's own OU path. Nothing else in
          # CI would have made that visible.
          python3 -P - <<'PY'
          import json, sys
          before = json.load(open("/tmp/catalog-before.json"))
          after = json.load(open("/tmp/catalog-after.json"))
          rc = 0
          if after["loopback_mode"] != {"merge": 1, "replace": 2}:
              print(f"::error::LOOPBACK_MODE is {after['loopback_mode']}; Microsoft's values are "
                    "merge=1, replace=2 (GroupPolicy.admx, client event 5311)")
              rc = 1
          if not after["user_policy_mode"]:
              # An empty set would satisfy every assertion below without checking anything.
              print("::error::no pack declares loopback any more - the catalog lost its "
                    "loopback packs, or load_packs() returned nothing")
              rc = 1
          for pack in sorted(set(before["user_policy_mode"]) - set(after["user_policy_mode"])):
              print(f"::error::{pack} declared loopback before the upgrade and does not any "
                    "more - the per-school user packs would stop reaching users")
              rc = 1
          for pack, mode in sorted(after["user_policy_mode"].items()):
              was = before["user_policy_mode"].get(pack)
              if mode == 2:
                  # No pack in the catalog needs Replace, and Replace silently drops every
                  # GPO linked in the user's own OU path on a managed client.
                  print(f"::error::{pack}: UserPolicyMode=2 (Replace) drops the user's own GPOs")
                  rc = 1
                  continue
              if was is not None and was != mode:
                  # Not an error: 7.3.2 legitimately changed 2 -> 1. The value itself is
                  # checked above, so a change only has to be seen, not blocked.
                  print(f"::notice::{pack}: UserPolicyMode changed {was} -> {mode} in this upgrade")
              print(f"loopback ok: {pack} -> UserPolicyMode={mode}")
          sys.exit(rc)
          PY

      # ---- run B: the migration branch, reachable ONLY through an upgrade ----------------
      - name: Run B - the legacy config path is migrated on upgrade
        if: steps.prev.outputs.skip != '1'
        run: |
          set -eux
          export DEBIAN_FRONTEND=noninteractive
          # The state from run A is still in place here, so purge is asserted, not just run.
          # `apt purge` deleting site.yaml would be the most expensive regression for a
          # school: it holds the bind password and is not backed up by dpkg anywhere.
          sudo -E apt-get purge -y lmn-gpo
          sudo test -f /etc/linuxmuster/lmn-gpo/site.yaml
          test "$(sudo stat -c %a /etc/linuxmuster/lmn-gpo/site.yaml)" = 600
          sudo test ! -e /var/lib/lmn-gpo
          sudo test ! -e /usr/lib/python3/dist-packages/lmn_gpo
          sudo test ! -e /usr/bin/lmn-gpo
          sudo rm -rf /etc/linuxmuster/lmn-gpo /etc/linuxmuster/lmgpo /var/lib/lmn-gpo
          sudo -E apt-get install -y ./previous/*.deb
          # a server that still sits on the pre-rename config path
          sudo rm -rf /etc/linuxmuster/lmn-gpo
          sudo install -d -m 0700 /etc/linuxmuster/lmgpo
          printf 'kmshost: kms.dev.lmschule.de\nveyon_bindpw_hex: 4d757374657221\n' \
            | sudo tee /etc/linuxmuster/lmgpo/site.yaml >/dev/null
          sudo chmod 0600 /etc/linuxmuster/lmgpo/site.yaml
          sudo sha256sum /etc/linuxmuster/lmgpo/site.yaml | sudo tee /tmp/legacy.sha256
          sudo -E apt-get install -y --reinstall --allow-downgrades ./packages/*.deb
          # migrated, tightened to 0600, legacy path removed
          sudo test -f /etc/linuxmuster/lmn-gpo/site.yaml
          test "$(sudo stat -c %a /etc/linuxmuster/lmn-gpo/site.yaml)" = 600
          test "$(sudo sha256sum /etc/linuxmuster/lmn-gpo/site.yaml | cut -d' ' -f1)" \
             = "$(cut -d' ' -f1 /tmp/legacy.sha256)"
          test ! -e /etc/linuxmuster/lmgpo/site.yaml
          test ! -d /etc/linuxmuster/lmgpo
          test -z "$(dpkg --verify lmn-gpo)"
          test -z "$(dpkg --audit)"

  # The one failure mode of a packaging change that no other job would notice: a catalog
  # YAML, a .ps1 or lib/veyon-default-pub.pem quietly falls out of the package because
  # debian/install matches differently than the old `cp -a`. It would only show up on a
  # school DC, as a pack that is never applied. So every build is compared, path by path,
  # against the newest published release: a path that disappears or changes mode/owner
  # fails the build. This gate is permanent, not just for the debian/ conversion.
  file-tree:
    needs: build
    runs-on: ubuntu-latest        # GitHub-hosted: gh is installed here, not in the container
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: packages
          path: packages/
      - name: Fetch the newest published release
        id: prev
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          mkdir -p previous
          # Prefer the newest real release, fall back to the newest prerelease. Skipping is
          # only legitimate when the repo has NO release at all: this gate stands between a
          # silently shrunk package and a school DC.
          tag=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 30 \
                  --json tagName,isDraft,isPrerelease \
                  --jq '[.[] | select(.isDraft == false and .isPrerelease == false)][0].tagName // ""')
          if [ -z "$tag" ]; then
            tag=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 30 \
                    --json tagName,isDraft --jq '[.[] | select(.isDraft == false)][0].tagName // ""')
            [ -n "$tag" ] && echo "::warning::no full release yet, comparing against prerelease $tag"
          fi
          if [ -z "$tag" ]; then
            if [ "$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1 --json tagName --jq 'length')" != "0" ]; then
              echo "::error::releases exist but none could be selected - refusing to skip"; exit 1
            fi
            echo "skip=1" >> "$GITHUB_OUTPUT"
            echo "::notice::first release of this package, nothing to compare against"
            exit 0
          fi
          for i in 1 2 3; do
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern '*.deb' --dir previous && break
            echo "download attempt $i failed, retrying"; sleep 10
          done
          test -n "$(ls previous/*.deb 2>/dev/null)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Compare the file tree with the released package
        if: steps.prev.outputs.skip != '1'
        env:
          PREV_TAG: ${{ steps.prev.outputs.tag }}
        run: |
          set -euo pipefail          # without pipefail `tee` would swallow the exit code
          # mode owner path, sorted. Directories are compared too: /var/lib/lmn-gpo/wallpapers
          # is shipped EMPTY, so losing it would be invisible in a file-only comparison.
          # A symlink prints "path -> target"; carry the target, so a retargeted link is
          # drift too. The package has none today -- which is exactly why it must not grow
          # one unnoticed.
          norm() { dpkg-deb -c "$1" | awk '{t = ($7 == "->" ? " " $7 " " $8 : ""); print $1, $2, $6 t}' | LC_ALL=C sort; }
          norm previous/*.deb > old.txt
          norm packages/*.deb > new.txt
          python3 - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import os, sys

          # Paths that may legitimately disappear, with the release that did it. Add an
          # entry ONLY together with the changelog sentence that explains it to admins.
          ALLOW_GONE = {
              # 7.3.3, debhelper conversion: dh_installchangelogs uses the name Debian
              # policy wants for a NATIVE package.
              "usr/share/doc/lmn-gpo/changelog.Debian.gz",
          }

          def read(name):
              rows = {}
              for line in open(name):
                  mode, owner, path = line.rstrip("\n").split(" ", 2)
                  rows[path.removeprefix("./")] = (mode, owner)
              return rows

          old, new = read("old.txt"), read("new.txt")
          gone = sorted(set(old) - set(new))
          added = sorted(set(new) - set(old))
          changed = sorted(p for p in set(old) & set(new) if old[p] != new[p])

          print(f"## File tree vs {os.environ['PREV_TAG']}")
          print()
          print(f"- released: {len(old)} entries, built: {len(new)} entries")
          for p in added:
              print(f"- added: `{p}`")
          for p in gone:
              if p in ALLOW_GONE:
                  print(f"- gone, allowed: `{p}`")
          bad = [p for p in gone if p not in ALLOW_GONE]
          for p in bad:
              print(f"::error::file lost from the package: {p}")
          for p in changed:
              print(f"::error::mode or owner changed: {p}: {old[p]} -> {new[p]}")
          if bad or changed:
              sys.exit(1)
          print()
          print("file tree: nothing lost, no mode or owner change")
          PY

  release:
    needs: [gate, build, install-smoke, upgrade-smoke, file-tree]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: packages
          path: packages/
      - name: Release notes with install instructions and the SHA256 (kept from the old workflow)
        run: |
          DEB=$(ls packages/*.deb)
          BASE=$(basename "$DEB")
          SHA=$(sha256sum "$DEB" | cut -d' ' -f1)
          {
            echo "## lmn-gpo ${GITHUB_REF_NAME}"
            echo ""
            echo "Debian package (\`Architecture: all\`) of the linuxmuster.net GPO template"
            echo "toolkit, for the Samba AD domain controller (linuxmuster.net 7.3, Ubuntu 24.04)."
            echo ""
            echo "### Install"
            echo '```bash'
            echo "apt install ./${BASE}      # or: dpkg -i ${BASE}"
            echo "lmn-gpo doctor"
            echo '```'
            echo ""
            echo "Installs entirely inside its own \`lmn-gpo\` namespace (no linuxmuster files"
            echo "touched) and reads its config from \`/etc/linuxmuster/lmn-gpo/site.yaml\` —"
            echo "migrated on install, kept on upgrade/remove. Changes: see \`debian/changelog\`."
            echo ""
            echo "\`SHA256: ${SHA}\`"
          } > notes.md
      # Draft -> assets -> digest check -> publish (why: see the header), all through the REST
      # API with the gh CLI that ships with the runner. The draft is addressed by the id its
      # create call returns, never by tag: right after a create the release list does not show
      # the draft yet (lmn-gpo v7.3.4, run 35865217323, failed on exactly that), GET
      # releases/tags/{tag} never returns drafts, and `gh release upload/edit <tag>` resolve a
      # draft by its tag as well.
      - name: Publish the GitHub release (draft first)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}     # through env, never interpolated into the script
          # Read-only token for the immutable-releases setting, used for that one call only.
          IMMUTABLE_CHECK_TOKEN: ${{ secrets.IMMUTABLE_CHECK_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          # Publish the .changes and exactly the files it lists (Files: " md5 size section priority
          # name"), so the .changes never names a file nobody can download.
          changes=(packages/*.changes)
          [ "${#changes[@]}" = 1 ] || { echo "::error::expected one .changes, found ${#changes[@]}"; exit 1; }
          mapfile -t listed < <(awk '/^Files:/ {f = 1; next} f && /^ / {print "packages/" $5; next} f {exit}' "${changes[0]}")
          assets=("${changes[0]}" "${listed[@]}")
          for f in "${assets[@]}"; do
            [ -f "$f" ] || { echo "::error::$f is listed in the .changes but was not built"; exit 1; }
          done
          printf '%s\n' "${listed[@]}" | grep -q '\.deb$' || { echo "::error::the .changes lists no .deb"; exit 1; }
          # GitHub renames special characters in asset names (`~` becomes `.`, `+` stays), so
          # names are compared in this normalised form, in which no two assets may collide.
          norm() { local n=${1##*/}; printf '%s\n' "${n//[^A-Za-z0-9._-]/.}"; }
          dup=$(for f in "${assets[@]}"; do norm "$f"; done | sort | uniq -d)
          [ -z "$dup" ] || { echo "::error::assets collide on GitHub as: $dup"; exit 1; }
          # Only a draft that an EARLIER run left behind is found by listing: it is minutes old,
          # so the list has caught up. A draft this run creates is never looked up. The retry
          # covers transient API errors only; an empty answer is final.
          lookup() {
            local i out
            for i in 1 2 3; do
              if out=$(gh api --paginate "repos/$GH_REPO/releases?per_page=100" \
                         --jq '.[] | select(.tag_name == env.TAG) | "\(.id) \(.draft)"'); then
                printf '%s' "$out"; return 0
              fi
              echo "::warning::listing the releases failed (attempt $i of 3)" >&2; sleep $((i * 5))
            done
            return 1
          }
          found=$(lookup) || { echo "::error::cannot list the releases of $GH_REPO"; exit 1; }
          if grep -q ' false$' <<< "$found"; then
            echo "::error::$TAG is already published; its assets are never replaced"; exit 1
          fi
          # Publishing a draft creates a missing tag at the default branch, so the tag must exist
          # (what `gh release create --verify-tag` checked before).
          gh api "repos/$GH_REPO/git/ref/tags/$TAG" --silent \
            || { echo "::error::tag $TAG does not exist in $GH_REPO"; exit 1; }
          case "$(grep -c . <<< "$found" || true)" in
            0) prerelease=false; case "$TAG" in *-rc*) prerelease=true ;; esac
               # the notes file comes first, GitHub appends the generated notes below it
               rid=$(gh api -X POST "repos/$GH_REPO/releases" -f tag_name="$TAG" \
                       -f name="lmn-gpo $TAG" -F body=@notes.md -F draft=true \
                       -F prerelease="$prerelease" -F generate_release_notes=true --jq .id)
               echo "created draft $rid for $TAG" ;;
            1) rid=${found%% *}
               echo "::notice::re-run: completing draft $rid that a failed run left behind" ;;
            *) echo "::error::more than one draft for $TAG: $(tr '\n' ' ' <<< "$found")"; exit 1 ;;
          esac
          [[ "$rid" =~ ^[0-9]+$ ]] || { echo "::error::no release id for $TAG: $rid"; exit 1; }
          # Upload by id, idempotently: an asset of the same name that is already on the draft
          # stays if its sha256 matches and is replaced if not (a rebuild, or an upload a failed
          # run left half done). Assets are deleted only while the release is still a draft.
          on_draft=$(gh api --paginate "repos/$GH_REPO/releases/$rid/assets?per_page=100" \
                       --jq '.[] | "\(.id) \(.digest // "none") \(.name)"')
          for f in "${assets[@]}"; do
            name=$(norm "$f"); sha=$(sha256sum "$f" | cut -d' ' -f1); have=
            while read -r aid digest aname <&3; do
              if [ -z "$aid" ] || [ "$(norm "$aname")" != "$name" ]; then continue; fi
              if [ "$digest" = "sha256:$sha" ]; then have=1; continue; fi
              [ "$(gh api "repos/$GH_REPO/releases/$rid" --jq .draft)" = true ] \
                || { echo "::error::release $rid is no longer a draft, not touching it"; exit 1; }
              echo "replacing $aname on the draft ($digest, built sha256:$sha)"
              gh api -X DELETE "repos/$GH_REPO/releases/assets/$aid"
            done 3<<< "$on_draft"
            if [ -n "$have" ]; then echo "$name is already on the draft, same sha256"; continue; fi
            url="https://uploads.github.com/repos/$GH_REPO/releases/$rid/assets?name=$(jq -rn --arg n "${f##*/}" '$n | @uri')"
            if ! resp=$(curl --fail-with-body -sS -X POST -H "Authorization: Bearer $GH_TOKEN" \
                          -H "Accept: application/vnd.github+json" \
                          -H "Content-Type: application/octet-stream" --data-binary "@$f" "$url"); then
              echo "$resp" >&2; echo "::error::upload of $f failed"; exit 1
            fi
            jq -r '"uploaded \(.name): \(.size) bytes, \(.digest)"' <<< "$resp"
          done
          # Publish only what was built: the draft must hold exactly the built files, compared as
          # (sha256 as computed by GitHub, normalised name), nothing more and nothing less.
          for f in "${assets[@]}"; do
            printf '%s %s\n' "$(sha256sum "$f" | cut -d' ' -f1)" "$(norm "$f")"
          done | sort > built.sha256
          gh api --paginate "repos/$GH_REPO/releases/$rid/assets?per_page=100" \
              --jq '.[] | "\(.digest // "none" | ltrimstr("sha256:")) \(.name)"' \
            | while read -r d n; do printf '%s %s\n' "$d" "$(norm "$n")"; done | sort > uploaded.sha256
          diff built.sha256 uploaded.sha256 \
            || { echo "::error::assets on the draft differ from the build, not publishing"; exit 1; }
          # Immutable or not at all (why: see the header). Checked at the last moment the release
          # is still a draft. A repo with the setting off answers {"enabled":false}; the docs also
          # name 404. Anything but enabled == true stops here and leaves the draft unpublished.
          [ -n "${IMMUTABLE_CHECK_TOKEN:-}" ] || {
            echo "::error::secret IMMUTABLE_CHECK_TOKEN is not set, so it cannot be proven that immutable releases are on; draft $rid stays unpublished"; exit 1; }
          if ! enabled=$(GH_TOKEN=$IMMUTABLE_CHECK_TOKEN gh api "repos/$GH_REPO/immutable-releases" --jq '.enabled'); then
            echo "::error::cannot read the immutable-releases setting of $GH_REPO (${enabled//$'\n'/ }); draft $rid stays unpublished"; exit 1
          fi
          [ "$enabled" = true ] || {
            echo "::error::immutable releases are not enabled for $GH_REPO (enabled=$enabled); draft $rid stays unpublished"; exit 1; }
          gh api -X PATCH "repos/$GH_REPO/releases/$rid" -F draft=false --jq '"published \(.html_url)"'
          # Re-read by id: the published release must be immutable. An error, never a warning, or
          # the run ends green with assets that can still be replaced. The retry only covers a
          # read that lags behind the publish.
          immutable=
          for i in 1 2 3; do
            immutable=$(gh api "repos/$GH_REPO/releases/$rid" --jq '.immutable') && [ "$immutable" = true ] && break
            [ "$i" = 3 ] || sleep $((i * 5))
          done
          if [ "$immutable" != true ]; then
            echo "::error::$TAG is published but NOT immutable (immutable=${immutable:-unreadable}), its assets can still be replaced: delete release $rid (the tag stays), turn immutable releases on, re-run this job"
            exit 1
          fi
          echo "$TAG is published and immutable"
