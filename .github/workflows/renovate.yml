#
# From linuxmusterDEV/templates/renovate.yml (config: renovate.json in the repo root). The same
# self-hosted Renovate as linuxmuster-radius (faircomp has no org-level Renovate app), hardened
# in stage A:
#  * actions pinned by commit SHA, and the Renovate engine pinned by version AND digest via
#    renovate-version. Without it the action runs its default engine (Renovate 39), which
#    rejects `managerFilePatterns`, does nothing and still ends green.
#  * a warning when RENOVATE_TOKEN is missing (see TOKEN).
# Weekly and on demand. It opens PRs that bump the action SHAs, the build image digest and the
# Renovate engine; a human MUST merge them (automerge is off in renovate.json).
#
# TOKEN: repo secret RENOVATE_TOKEN is REQUIRED as soon as an update touches
# .github/workflows/ (it always does here): GitHub never lets GITHUB_TOKEN push workflow files,
# and PRs opened with GITHUB_TOKEN start no CI. Use a fine-grained PAT limited to this repo with
# Contents, Pull requests, Issues and Workflows: read and write. Without the secret the job
# falls back to GITHUB_TOKEN, can look up and plan, but cannot push the bumps.
# After the first merge: `gh workflow run renovate.yml -f dryRun=true` and check the log for
# "Found renovate config errors" (the job stays green even then).

name: Renovate

on:
  schedule:
    - cron: "0 4 * * 1" # every Monday 04:00 UTC
  workflow_dispatch:
    inputs:
      dryRun:
        description: "Dry run (extract + plan, open NO PRs)"
        type: boolean
        default: false
      logLevel:
        description: "Renovate log level"
        type: choice
        default: "info"
        options: ["info", "debug"]

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    runs-on: ubuntu-24.04
    env:
      HAS_RENOVATE_TOKEN: ${{ secrets.RENOVATE_TOKEN != '' }}
    steps:
      - name: Warn when RENOVATE_TOKEN is missing
        if: env.HAS_RENOVATE_TOKEN != 'true'
        run: echo "::warning::RENOVATE_TOKEN is not set; Renovate cannot push changes to .github/workflows/ with GITHUB_TOKEN"

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Renovate
        uses: renovatebot/github-action@f24426972367551f3391720e34317783a92fd32b # v41.0.8
        with:
          token: ${{ secrets.RENOVATE_TOKEN || github.token }}
          renovate-version: 44.105.4@sha256:e155ebea05260c388f12afa521fc23a485f119b32b0108ed9b17616f079e7519
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_PLATFORM: github
          RENOVATE_ONBOARDING: "false" # renovate.json already present -> no onboarding PR
          RENOVATE_DRY_RUN: ${{ inputs.dryRun == true && 'full' || '' }}
          LOG_LEVEL: ${{ inputs.logLevel || 'info' }}
